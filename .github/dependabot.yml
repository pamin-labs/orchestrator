version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Three packages whose version is decided somewhere dependabot cannot read.
    #
    # drizzle-orm and drizzle-kit are one release named twice — the kit writes
    # the migration format the ORM reads — and dependabot resolves each package
    # alone. drizzle also publishes branch snapshots to npm under dist-tags of
    # their own, so "the newest version" is a build off somebody's branch: PR #12
    # proposed 1.0.0-rc.5-169397b for the ORM and 1.0.0-rc.5-ab785fc for the kit,
    # two different commits, while the `rc` tag still pointed at 1.0.0-rc.4. A
    # version range would not help — rc.6 reproduces it exactly. Both move by
    # hand, together, when `rc` moves.
    #
    # @types/bun describes a runtime pinned at 1.3.14 by four workflows and by
    # digest in the agent image. Left floating it reached 1.4.0, whose `Response`
    # grew `textStream()`, and 81 panel files stopped typechecking over a method
    # nothing here calls. It moves when the `BUN_VERSION` pins move.
    #
    # `test/governance/version.test.ts` is the half of each rule that still holds
    # when the bump arrives by hand instead.
    ignore:
      - dependency-name: drizzle-orm
      - dependency-name: drizzle-kit
      - dependency-name: "@types/bun"
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      rest:
        patterns: ["*"]
        exclude-patterns: ["@radix-ui/*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
