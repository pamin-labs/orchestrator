version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      rest:
        patterns: ["*"]
        exclude-patterns: ["@radix-ui/*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
