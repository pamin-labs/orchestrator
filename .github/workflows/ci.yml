# Every check this project has, on every push and every pull request.
#
# The repository already enforces a lot in `bun test` — hard constraint 3 says
# anything an `if` can catch never goes in a prompt, and several of those checks
# read the source as text (the prompt-cache position, the auth header having one
# home, config keys reaching Ctx). So CI's job is mostly to run that suite
# somewhere other than the author's machine, which is the one place it has never
# run.
#
# `test/sandbox-live.test.ts` needs a running opensandbox-server and skips
# loudly without one. It stays skipped here on purpose: standing up Docker, the
# sandbox server and the agent image on every push would trade minutes per run
# for a signal the author already gets locally. The suite says how many skipped.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same PR makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun's global download cache, not `node_modules`: the install itself is
      # fast, and what it spends is the network. Keyed by the lockfile, so a run
      # that changes no dependency restores exactly what the last one downloaded.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # `--frozen-lockfile`: a lockfile that does not match package.json is a
      # difference between what was tested and what will run, and CI is where
      # that has to fail rather than resolve itself quietly.
      - run: bun install --frozen-lockfile

      - name: apply safe Fallow fixes and format
        id: cleanup
        run: |
          bun run audit:fix
          git restore --source=HEAD -- .fallowrc.json .fallow/.gitignore
          bun run format
          git diff --check
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff --stat
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: report cleanup required on a fork
        if: >-
          steps.cleanup.outputs.changed == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '::error::Biome or Fallow changed this fork; run bun run audit:fix && bun run format and push the result.'
          exit 1

      - name: audit changed code
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          changed-since: ${{ github.event.pull_request.base.sha || github.event.before }}
          dead-code-baseline: .fallow/dead-code.json
          health-baseline: .fallow/health.json
          dupes-baseline: .fallow/dupes.json
          comment: ${{ github.event_name == 'pull_request' }}
          comment-layout: compact

      - name: validate
        run: bun run validate

      - uses: actions/create-github-app-token@v3
        id: cleanup-token
        if: >-
          steps.cleanup.outputs.changed == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          app-id: ${{ vars.ORCH_APP_ID }}
          private-key: ${{ secrets.ORCH_APP_KEY }}

      - name: commit automated cleanup
        if: steps.cleanup-token.outcome == 'success'
        env:
          TOKEN: ${{ steps.cleanup-token.outputs.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name 'orchestrator-agentic-app[bot]'
          git config user.email '317244264+orchestrator-agentic-app[bot]@users.noreply.github.com'
          git add --all
          git commit --no-verify -s -m 'chore(quality): apply automated cleanup'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --no-verify origin "HEAD:${TARGET_BRANCH}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

  # Every commit carries `Signed-off-by`, checked here rather than by an app.
  #
  # A ruleset cannot express DCO — its signature rule is about GPG, and GitHub's
  # own `web_commit_signoff_required` only covers commits made in the browser. So
  # this is the required check, and it is deliberately not a third-party action:
  # the whole of it is `git log`, and an action here would be a supply chain for
  # a grep.
  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # Just the PR's own commits, and their parent so the range is expressible.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: every commit is signed off
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          bad=0
          while read -r sha; do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            # Bots that belong to this repository are exempt, and this is the
            # honest way to say it rather than skipping the whole job for them:
            # a required check that is *skipped* sits pending forever, so every
            # dependabot pull request would be unmergeable by a rule about
            # certifying authorship — which is not a thing dependabot can do.
            case "$author" in
              *"[bot]@users.noreply.github.com>") continue ;;
            esac
            # The trailer has to match the author. A sign-off certifying somebody
            # else is the one thing the DCO exists to prevent, so a present-but-
            # wrong line is not better than a missing one.
            if ! git log -1 --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") — no 'Signed-off-by: $author'"
              bad=1
            fi
          done < <(git rev-list --no-merges "$base..$head")
          if [ "$bad" = 1 ]; then
            echo "Fix with: git rebase --signoff $base && git push --force-with-lease"
            exit 1
          fi
          echo "all commits signed off"
