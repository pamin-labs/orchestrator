name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same PR makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.5

jobs:
  quality-format:
    name: quality-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: git diff --exit-code

  quality-types:
    name: quality-types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  quality-oxlint:
    name: quality-oxlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

  quality-fallow:
    name: quality-fallow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: audit repository structure
        run: |
          set -o pipefail
          bun run audit -- --format compact | tee -a "$GITHUB_STEP_SUMMARY"

  test-main:
    name: test-main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - run: bun run perf:bench
      - run: bun test --max-concurrency 4

  build-web:
    name: build-web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - run: bun run perf:budget
      - run: git diff --exit-code

  dco:
    name: dco
    runs-on: ubuntu-24.04
    steps:
      - name: skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo 'DCO applies to pull requests.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: verify author sign-off
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          while read -r sha; do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            case "$author" in *"[bot]@users.noreply.github.com>") continue ;; esac
            if ! git log -1 --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by: $author"
              bad=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          test "$bad" = 0

  pr-plan:
    name: pr-plan
    runs-on: ubuntu-24.04
    steps:
      - name: verify engineering plan sections
        if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          headings=(
            'Affected boundaries'
            'Current invariants'
            'Data/control flow'
            'Public API impact'
            'Persistence/migration impact'
            'Failure semantics'
            'Async/concurrency impact'
            'Security/trust boundaries'
            'Performance/observability impact'
            'Compatibility strategy'
            'Test strategy'
            'Rollback'
          )
          missing=0
          for heading in "${headings[@]}"; do
            section=$(printf '%s\n' "$PR_BODY" | awk -v heading="$heading" '
              $0 ~ "^#{2,3}[[:space:]]+" heading "[[:space:]]*$" { active=1; next }
              active && /^#{2,3}[[:space:]]+/ { exit }
              active { print }
            ' | sed '/^[[:space:]]*<!--[[:space:]]*/,/-->/d' | sed '/^[[:space:]]*$/d')
            if [ -z "$section" ] || printf '%s\n' "$section" | grep -Eq '^N/A:[[:space:]]*$'; then
              echo "::error::PR section '$heading' needs evidence or 'N/A: reason'."
              missing=1
            fi
          done
          test "$missing" = 0
