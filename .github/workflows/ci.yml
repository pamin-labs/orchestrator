name: ci

on:
  push:
    branches: [main]
  # `edited` as well as the three defaults, because `pr-plan` reads
  # `github.event.pull_request.body` — and that is the body as it was when the
  # event fired. Without this, filling in the engineering plan does not re-run
  # the check that asked for it: the author has to push a commit they do not
  # otherwise need, and until they do the pull request shows a red gate against
  # a body that already satisfies it. That was observed here, twice.
  #
  # The whole workflow re-runs rather than `pr-plan` alone, and the alternative
  # was rejected on purpose: skipping the other jobs with an `if` reports them
  # as *skipped*, which a required status check reads as "never posted" and
  # leaves the pull request pending forever — the same trap as requiring a
  # context nothing produces. `concurrency` already cancels the previous run, so
  # a burst of edits costs one pass of a workflow that takes about a minute.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# A second push to the same PR makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  quality-format:
    name: quality-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run format:check
      - run: git diff --exit-code

  quality-types:
    name: quality-types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run typecheck

  quality-oxlint:
    name: quality-oxlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run lint

  quality-fallow:
    name: quality-fallow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: open report directory
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/report"
          printf '%s' "$PR_NUMBER" > "$RUNNER_TEMP/report/pr-number.txt"
      - name: audit repository structure
        run: |
          set +e
          bun run audit -- --format json --quiet --output-file "$RUNNER_TEMP/report/fallow-audit.json"
          audit_status=$?
          set -e
          ./node_modules/.bin/fallow report --from "$RUNNER_TEMP/report/fallow-audit.json" --format github-annotations
          ./node_modules/.bin/fallow report --from "$RUNNER_TEMP/report/fallow-audit.json" --format github-summary >> "$GITHUB_STEP_SUMMARY"
          exit "$audit_status"
      # Reported, never gated. The count moves whenever a file is added, so a
      # threshold on it would be a coverage percentage by another name — and the
      # standard already refuses those. What is worth seeing on every pull
      # request is a module that no test reaches at all, which a percentage
      # cannot say. Dispositions live in docs/operations/coverage-gaps.md.
      - name: report coverage gaps
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            echo '### Coverage gaps'
            echo '```'
            bun run health:gaps 2>&1 | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: report-fallow
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          retention-days: 7

  test-main:
    name: test-main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run build:web
      - name: open report directory
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/report"
          printf '%s' "$PR_NUMBER" > "$RUNNER_TEMP/report/pr-number.txt"
      - run: bun test --parallel --reporter=junit --reporter-outfile="$RUNNER_TEMP/report/junit.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: report-tests
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          retention-days: 7

  test-coverage:
    name: test-coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run build:web
      - run: bun run test:coverage
      - name: collect the coverage report
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/report"
          printf '%s' "$PR_NUMBER" > "$RUNNER_TEMP/report/pr-number.txt"
          # `lcov.info` is what Codecov reads; the Istanbul map is what Fallow reads.
          cp coverage/lcov.info coverage/coverage-final.json "$RUNNER_TEMP/report/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: report-coverage
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          retention-days: 7

  build-web:
    name: build-web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run build:web
      - name: check size budgets
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/report"
          printf '%s' "$PR_NUMBER" > "$RUNNER_TEMP/report/pr-number.txt"
          bun run perf:budget | tee "$RUNNER_TEMP/report/budget.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: report-budget
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          retention-days: 7
      - run: git diff --exit-code

  dco:
    name: dco
    runs-on: ubuntu-24.04
    steps:
      - name: skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo 'DCO applies to pull requests.'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: verify author sign-off
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          while read -r sha; do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            case "$author" in *"[bot]@users.noreply.github.com>") continue ;; esac
            if ! git log -1 --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by: $author"
              bad=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          test "$bad" = 0

  pr-plan:
    name: pr-plan
    runs-on: ubuntu-24.04
    steps:
      - name: verify engineering plan sections
        if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          headings=(
            'Affected boundaries'
            'Current invariants'
            'Data/control flow'
            'Public API impact'
            'Persistence/migration impact'
            'Failure semantics'
            'Async/concurrency impact'
            'Security/trust boundaries'
            'Performance/observability impact'
            'Compatibility strategy'
            'Test strategy'
            'Rollback'
          )
          missing=0
          for heading in "${headings[@]}"; do
            section=$(printf '%s\n' "$PR_BODY" | awk -v heading="$heading" '
              $0 ~ "^#{2,3}[[:space:]]+" heading "[[:space:]]*$" { active=1; next }
              active && /^#{2,3}[[:space:]]+/ { exit }
              active { print }
            ' | sed '/^[[:space:]]*<!--[[:space:]]*/,/-->/d' | sed '/^[[:space:]]*$/d')
            if [ -z "$section" ] || printf '%s\n' "$section" | grep -Eq '^N/A:[[:space:]]*$'; then
              echo "::error::PR section '$heading' needs evidence or 'N/A: reason'."
              missing=1
            fi
          done
          test "$missing" = 0
