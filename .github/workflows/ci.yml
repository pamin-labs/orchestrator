name: ci

on:
  push:
    branches: [main]
  # `edited` as well as the three defaults, because `pr-plan` reads
  # `github.event.pull_request.body` — and that is the body as it was when the
  # event fired. Without this, filling in the engineering plan does not re-run
  # the check that asked for it: the author has to push a commit they do not
  # otherwise need, and until they do the pull request shows a red gate against
  # a body that already satisfies it. That was observed here, twice.
  #
  # The whole workflow re-runs rather than `pr-plan` alone, and the alternative
  # was rejected on purpose: skipping the other jobs with an `if` reports them
  # as *skipped*, which a required status check reads as "never posted" and
  # leaves the pull request pending forever — the same trap as requiring a
  # context nothing produces. `concurrency` already cancels the previous run, so
  # a burst of edits costs one pass of a workflow that takes about a minute.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Three jobs, not nine, and the reason is the invoice rather than the clock.
# Actions bills per job, rounded up to the minute: nine jobs whose real total is
# 229s cost ten minutes, because a 4-second `pr-plan` and a 12-second
# `quality-format` each bill a whole one. Grouping the work that shares a
# checkout and an install turns ten billed minutes into about four for the same
# checks — and the checks stay individually named as steps, so a failure still
# says which one.
#
# What is NOT grouped: anything with a different failure meaning or a different
# runtime shape. `security-container` builds an image and takes two minutes on
# its own; CodeQL runs on GitHub's own analysis infrastructure.

# A second push to the same PR makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  # Static checks: no test run, no coverage, nothing that needs a database.
  # Four separate jobs before, each paying its own checkout, Bun install and
  # billed minute for work measured in seconds.
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: format
        run: bun run format:check
      - name: types
        run: bun run typecheck
      - name: lint
        run: bun run lint
      # Two failures this catches, both silent otherwise. Editing an English
      # `<Trans>` retires its id — the id is a hash of the source — so eight
      # catalogs lose that string at once and the panel renders English inside a
      # Russian pane. And a translation that quietly dropped `{count}` is
      # well-formed ICU rendering the wrong sentence.
      - name: every message is translated and keeps its placeholders
        run: bun run i18n:validate
      # Regenerated, not merely validated: `lingui extract` has no `--check`, so
      # running it and diffing is the only thing that answers whether the
      # catalogues and the READMEs' tables still describe the source.
      # `i18n:extract` derives all three — the catalogues, `zh-Hant` from `zh`,
      # and the progress table in both READMEs — because all three are a
      # function of the same messages.
      #
      # `preflight` ran this and CI did not, which made a voluntary local
      # command the only gate on a checked-in generated file. The `git diff`
      # below could not stand in for it: a stale table nothing regenerates is
      # not a dirty tree. Measured on a commit whose table read 42% against
      # complete catalogues — `i18n:validate` passed it and so did the diff.
      - name: catalogues and the README tables match the source
        run: bun run i18n:extract && git diff --exit-code -- locales/ README.md README.zh-CN.md
      # Nothing above may leave the tree dirty — a formatter or a build that
      # writes into the repository is a diff the author never saw.
      - name: nothing was rewritten
        run: git diff --exit-code

  # The suite, its coverage, and the audit that reads that coverage — one run of
  # the tests instead of three.
  #
  # `test-main`, `test-coverage` and `quality-fallow` each ran the suite: 46s,
  # 52s and 62s, and the last two ran the *same* command. The instrumented run
  # is the strictly stronger one, so it is the one kept; `fallow audit` reads
  # the map it produces, which is the pairing AGENTS.md asks for and the thing
  # CI got wrong for weeks by running a bare `audit` with no coverage present.
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The suite runs against a real PostgreSQL, the same engine the product uses:
    # each worker copies a migrated template into its own database. A second
    # engine for tests would mean the shape a test sees is not the shape a
    # deployment gets, which it was — one returned `{rows, …}` where the other
    # returns an array. Locally this is `bun run db:up`.
    env:
      ORCH_TEST_DATABASE_URL: postgres://orchestrator:orchestrator@127.0.0.1:5433/orchestrator
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # `fallow audit --base` needs history to compare against.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The compose file, not a `services:` block restating half of it. A service
      # container takes no `command`, so it silently ran on PostgreSQL's default
      # connection limit while the compose file raises it and says why: each
      # worker holds a pool wide enough for the panel snapshot's nineteen
      # concurrent statements, and four workers took the default over —
      # `sorry, too many clients already`, on the run that opened this branch's
      # pull request. Every setting for this server lives in that one file.
      - name: the suite's postgres, from the file that configures it
        run: bun run db:test:up
      # Before anything that can fail. `upload-artifact` runs on `always()` so a
      # red job still hands its evidence over — but it cannot upload a directory
      # that a failing step never got to create, and it then reports "no files
      # found", which is a second, misleading error stacked on the real one.
      - name: open report directory
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/report"
          printf '%s' "$PR_NUMBER" > "$RUNNER_TEMP/report/pr-number.txt"
      # The only `build:web` in this workflow. `quality` ran a second one purely
      # to measure the result, so the same bundle was compiled twice per pull
      # request; the measurement moved to the job that already has a bundle.
      - run: bun run build:web
      - name: size budgets
        run: |
          set -euo pipefail
          bun run perf:budget | tee "$RUNNER_TEMP/report/budget.txt"
      # `test:coverage:ci` and not the commands inlined here: a gate that
      # assembles its own version of a project command drifts from the one a
      # developer runs, and then only CI knows what is actually checked. It is
      # `test:coverage` plus a JUnit file, which is the one thing CI needs and a
      # laptop does not.
      - name: tests with coverage
        env:
          JUNIT_OUT: ${{ runner.temp }}/report/junit.xml
        run: |
          set -euo pipefail
          bun run test:coverage:ci
          # `lcov.info` is what Codecov reads; the Istanbul map is what Fallow reads.
          cp coverage/lcov.info coverage/coverage-final.json "$RUNNER_TEMP/report/"
      - name: audit repository structure
        run: |
          set +e
          bun run audit -- --coverage coverage/coverage-final.json --format json --quiet --output-file "$RUNNER_TEMP/report/fallow-audit.json"
          audit_status=$?
          set -e
          ./node_modules/.bin/fallow report --from "$RUNNER_TEMP/report/fallow-audit.json" --format github-annotations
          ./node_modules/.bin/fallow report --from "$RUNNER_TEMP/report/fallow-audit.json" --format github-summary >> "$GITHUB_STEP_SUMMARY"
          exit "$audit_status"
      # Reported, never gated. The count moves whenever a file is added, so a
      # threshold on it would be a coverage percentage by another name — and the
      # standard already refuses those. What is worth seeing on every pull
      # request is a module that no test reaches at all, which a percentage
      # cannot say. Dispositions live in docs/operations/coverage-gaps.md.
      - name: report coverage gaps
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            echo '### Coverage gaps'
            echo '```'
            bun run health:gaps 2>&1 | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: report-tests
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          retention-days: 7

  # Checks about the pull request itself rather than about the code in it. Both
  # are metadata reads and finish in seconds; together they are one billed
  # minute instead of two.
  pr:
    name: pr
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo 'These checks describe a pull request.'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: verify author sign-off
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          while read -r sha; do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            case "$author" in *"[bot]@users.noreply.github.com>") continue ;; esac
            if ! git log -1 --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by: $author"
              bad=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          test "$bad" = 0
      - name: verify engineering plan sections
        if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          headings=(
            'Affected boundaries'
            'Current invariants'
            'Data/control flow'
            'Public API impact'
            'Persistence/migration impact'
            'Failure semantics'
            'Async/concurrency impact'
            'Security/trust boundaries'
            'Performance/observability impact'
            'Compatibility strategy'
            'Test strategy'
            'Rollback'
          )
          missing=0
          for heading in "${headings[@]}"; do
            section=$(printf '%s\n' "$PR_BODY" | awk -v heading="$heading" '
              $0 ~ "^#{2,3}[[:space:]]+" heading "[[:space:]]*$" { active=1; next }
              active && /^#{2,3}[[:space:]]+/ { exit }
              active { print }
            ' | sed '/^[[:space:]]*<!--[[:space:]]*/,/-->/d' | sed '/^[[:space:]]*$/d')
            if [ -z "$section" ] || printf '%s\n' "$section" | grep -Eq '^N/A:[[:space:]]*$'; then
              echo "::error::PR section '$heading' needs evidence or 'N/A: reason'."
              missing=1
            fi
          done
          test "$missing" = 0
