name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  TRIVY_VERSION: v0.74.0

jobs:
  security-fallow:
    name: security-fallow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: scan newly reachable security candidates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set +e
          bunx fallow security --changed-since "$BASE_SHA" --gate newly-reachable --surface --format json --quiet --output-file "$RUNNER_TEMP/fallow-security.json"
          security_status=$?
          set -e
          bunx fallow report --from "$RUNNER_TEMP/fallow-security.json" --format github-annotations
          bunx fallow report --from "$RUNNER_TEMP/fallow-security.json" --format github-summary >> "$GITHUB_STEP_SUMMARY"
          exit "$security_status"

  security-dependencies:
    name: security-dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun audit
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          license-check: true
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, MPL-2.0, Unlicense, 0BSD

  security-container:
    name: security-container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: scan repository
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          # Repeated as inputs even though `trivy.yaml` says both. The action
          # exports its own defaults as `TRIVY_*` environment variables before
          # reading the config file — the log shows it setting `TRIVY_SEVERITY`
          # to every level — and an environment variable wins over the file. So
          # the gate was scanning at the action's policy, not ours: 53 findings
          # against 0, every one of them `affected` or `fix_deferred`, meaning
          # no fix exists to apply. Passing them here makes the two agree.
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: table
      - name: create filesystem SPDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: trivy-fs.spdx.json
          exit-code: '0'
      - name: create filesystem CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: trivy-fs.cdx.json
          exit-code: '0'
      - run: docker build --tag orchestrator-agent:ci --file docker/agent.Dockerfile .
      - name: scan container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orchestrator-agent:ci
          trivy-config: trivy.yaml
          # Same as the filesystem scan above: the action's environment defaults
          # override `trivy.yaml`, so the policy is stated where it is read.
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: table
      - name: create container SPDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orchestrator-agent:ci
          format: spdx-json
          output: trivy-image.spdx.json
          exit-code: '0'
      - name: create container CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orchestrator-agent:ci
          format: cyclonedx
          output: trivy-image.cdx.json
          exit-code: '0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-sboms
          path: trivy-*.json
          if-no-files-found: error
          retention-days: 7

  workflow-static:
    name: workflow-static
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read # Verify actionlint release provenance.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: verify and run actionlint release
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check -
          gh attestation verify "$archive" --repo rhysd/actionlint
          tar -xzf "$archive" actionlint
          ./actionlint -color
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.2
          enable-cache: false
      - run: uvx --from zizmor==1.29.0 zizmor --pedantic .github/workflows
