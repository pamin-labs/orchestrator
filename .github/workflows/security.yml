name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  TRIVY_VERSION: v0.74.0

jobs:
  # Which of the expensive jobs below this commit can actually invalidate.
  #
  # The trap this deliberately avoids is `paths-ignore` on the workflow: a
  # workflow that never fires never posts its check runs, and a required check
  # that was never posted is *missing* rather than skipped, so the pull request
  # waits on it forever. A job skipped by `if` is different — the workflow ran,
  # the check run exists, and it completes as `skipped`, which the merge gate
  # accepts. The cost is one checkout and a `grep`.
  #
  # The two gated jobs ask `!= 'false'` rather than `== 'true'`, with an
  # `always()` so a dependency that did not succeed does not skip them. A job
  # skipped for any reason — including because this one failed — still completes
  # as `skipped`, which the merge gate accepts: an `== 'true'` condition would
  # make a broken filter silently drop two required security checks. Unset is
  # not "no", so the only thing that turns a gate off is this job saying so.
  #
  # Outside a pull request every gate runs regardless of what changed, because
  # `release.yml` demands `completed:success` from every name in
  # `.github/required-checks.txt` for the main SHA it releases — and `skipped`
  # is not `success`. A docs-only commit landing on main would otherwise make
  # that commit unreleasable.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      container: ${{ steps.filter.outputs.container }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # The pull request is checked out as its merge commit, so the first
          # parent is the base it would merge into: two commits is the whole
          # diff, and a full history costs seconds this job exists to save.
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo 'container=true' >> "$GITHUB_OUTPUT"
            echo 'workflows=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          matches() { printf '%s\n' "$files" | grep -qE "$1"; }
          # `security-container` scans the filesystem as well as the image, so
          # the lockfile and the manifest count as container input even though
          # they are not under `docker/`.
          if matches '^(docker/|trivy\.yaml$|bun\.lock$|package\.json$)'; then
            echo 'container=true' >> "$GITHUB_OUTPUT"
          else
            echo 'container=false' >> "$GITHUB_OUTPUT"
          fi
          if matches '^\.github/'; then
            echo 'workflows=true' >> "$GITHUB_OUTPUT"
          else
            echo 'workflows=false' >> "$GITHUB_OUTPUT"
          fi

  security-fallow:
    name: security-fallow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: scan newly reachable security candidates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set +e
          bunx fallow security --changed-since "$BASE_SHA" --gate newly-reachable --surface --format json --quiet --output-file "$RUNNER_TEMP/fallow-security.json"
          security_status=$?
          set -e
          bunx fallow report --from "$RUNNER_TEMP/fallow-security.json" --format github-annotations
          bunx fallow report --from "$RUNNER_TEMP/fallow-security.json" --format github-summary >> "$GITHUB_STEP_SUMMARY"
          exit "$security_status"

  security-dependencies:
    name: security-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun audit
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          license-check: true
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, MPL-2.0, Unlicense, 0BSD

  security-container:
    name: security-container
    needs: changes
    if: always() && needs.changes.outputs.container != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          # Repeated as inputs even though `trivy.yaml` says both. The action
          # exports its own defaults as `TRIVY_*` environment variables before
          # reading the config file — the log shows it setting `TRIVY_SEVERITY`
          # to every level — and an environment variable wins over the file. So
          # the gate was scanning at the action's policy, not ours: 53 findings
          # against 0, every one of them `affected` or `fix_deferred`, meaning
          # no fix exists to apply. Passing them here makes the two agree.
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: table
      - name: create filesystem SPDX SBOM
        # Evidence for a release, not an answer a pull request needs: four SBOM
        # generations cost 28s per run and nothing gates on them. `release.yml`
        # produces its own from the exact source it publishes.
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: trivy-fs.spdx.json
          exit-code: '0'
      - name: create filesystem CycloneDX SBOM
        # Evidence for a release, not an answer a pull request needs: four SBOM
        # generations cost 28s per run and nothing gates on them. `release.yml`
        # produces its own from the exact source it publishes.
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: trivy-fs.cdx.json
          exit-code: '0'
      # Built through buildx with a layer cache, because 35 of this job's 125
      # seconds were rebuilding an image whose Dockerfile rarely changes: an apt
      # upgrade, a Node tarball and two npm installs, all identical run to run.
      # `type=gha` keeps the layers in the same cache Actions already provides,
      # so a run that changes nothing under `docker/` reuses them.
      #
      # `load: true` because the scanner below reads it from the local daemon
      # rather than a registry — this image is built to be inspected, never
      # pushed.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/agent.Dockerfile
          tags: orchestrator-agent:ci
          load: true
          # The same scope `release.yml` writes from its amd64 `image-build`, so
          # a pull request warms from the last release instead of from nothing.
          # An unscoped `type=gha` is its own namespace: the two jobs built the
          # identical Dockerfile and shared no layer.
          cache-from: type=gha,scope=orch-agent-amd64
          cache-to: type=gha,mode=max,scope=orch-agent-amd64
      # Before the scanner, because "it runs" is the cheaper question and the one
      # a pull request breaks: `release.yml` asks it too, but only at a release.
      - name: the image can do what the roles promise
        run: ./scripts/image-smoke.sh orchestrator-agent:ci
      - name: scan container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orchestrator-agent:ci
          trivy-config: trivy.yaml
          # Same as the filesystem scan above: the action's environment defaults
          # override `trivy.yaml`, so the policy is stated where it is read.
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: table
      # What the gate above does not fail on, printed anyway.
      #
      # `ignore-unfixed` on the gate is not the same as not caring. An advisory
      # with no published fix cannot be acted on by the person whose pull
      # request is being blocked: the only ways out are changing base image or
      # dropping the package, which are decisions somebody makes deliberately
      # and not under a red check. Blocking on them teaches people to turn the
      # gate off, which costs the fixable ones too.
      #
      # But not blocking is only defensible if the list is visible, so this step
      # prints it on every run — 53 at the time it was added, all of them
      # `affected` or `fix_deferred` in Debian's own tracker. It is the same
      # arrangement `quality-fallow` uses for coverage gaps: reported, never
      # gated, and never silent.
      - name: report advisories with no fix available
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orchestrator-agent:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: table
          output: trivy-unfixed.txt
      - name: publish the unfixed list
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            echo '### Advisories with no fix available'
            echo
            echo 'Not gated: no published fix means nothing this pull request can do.'
            echo 'Acting on them means changing base image or dropping a package.'
            echo
            echo '```'
            tail -c 60000 trivy-unfixed.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: create container SPDX SBOM
        # Evidence for a release, not an answer a pull request needs: four SBOM
        # generations cost 28s per run and nothing gates on them. `release.yml`
        # produces its own from the exact source it publishes.
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orchestrator-agent:ci
          format: spdx-json
          output: trivy-image.spdx.json
          exit-code: '0'
      - name: create container CycloneDX SBOM
        # Evidence for a release, not an answer a pull request needs: four SBOM
        # generations cost 28s per run and nothing gates on them. `release.yml`
        # produces its own from the exact source it publishes.
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orchestrator-agent:ci
          format: cyclonedx
          output: trivy-image.cdx.json
          exit-code: '0'
      # Skipped with the SBOMs it uploads. `if-no-files-found: error` is right —
      # an upload that silently ships nothing is worse than one that fails — but
      # it means this step has to follow the same condition as its inputs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name != 'pull_request'
        with:
          name: security-sboms
          path: trivy-*.json
          if-no-files-found: error
          retention-days: 7

  workflow-static:
    name: workflow-static
    needs: changes
    if: always() && needs.changes.outputs.workflows != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # Verify actionlint release provenance.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verify and run actionlint release
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check -
          gh attestation verify "$archive" --repo rhysd/actionlint
          tar -xzf "$archive" actionlint
          ./actionlint -color
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.2
          enable-cache: false
      - run: uvx --from zizmor==1.29.0 zizmor --pedantic .github/workflows
