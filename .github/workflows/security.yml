name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  TRIVY_VERSION: v0.74.0

jobs:
  security-fallow:
    name: security-fallow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: scan newly reachable security candidates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set +e
          bunx fallow security --changed-since "$BASE_SHA" --gate newly-reachable --surface --format json --quiet --output-file "$RUNNER_TEMP/fallow-security.json"
          security_status=$?
          set -e
          bunx fallow report --from "$RUNNER_TEMP/fallow-security.json" --format github-annotations
          bunx fallow report --from "$RUNNER_TEMP/fallow-security.json" --format github-summary >> "$GITHUB_STEP_SUMMARY"
          exit "$security_status"

  security-dependencies:
    name: security-dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun audit
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          license-check: true
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, MPL-2.0, Unlicense, 0BSD

  security-container:
    name: security-container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: scan repository
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          # Repeated as inputs even though `trivy.yaml` says both. The action
          # exports its own defaults as `TRIVY_*` environment variables before
          # reading the config file — the log shows it setting `TRIVY_SEVERITY`
          # to every level — and an environment variable wins over the file. So
          # the gate was scanning at the action's policy, not ours: 53 findings
          # against 0, every one of them `affected` or `fix_deferred`, meaning
          # no fix exists to apply. Passing them here makes the two agree.
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: table
      - name: create filesystem SPDX SBOM
        # Evidence for a release, not an answer a pull request needs: four SBOM
        # generations cost 28s per run and nothing gates on them. `release.yml`
        # produces its own from the exact source it publishes.
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: trivy-fs.spdx.json
          exit-code: '0'
      - name: create filesystem CycloneDX SBOM
        # Evidence for a release, not an answer a pull request needs: four SBOM
        # generations cost 28s per run and nothing gates on them. `release.yml`
        # produces its own from the exact source it publishes.
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: trivy-fs.cdx.json
          exit-code: '0'
      # Built through buildx with a layer cache, because 35 of this job's 125
      # seconds were rebuilding an image whose Dockerfile rarely changes: an apt
      # upgrade, a Node tarball and two npm installs, all identical run to run.
      # `type=gha` keeps the layers in the same cache Actions already provides,
      # so a run that changes nothing under `docker/` reuses them.
      #
      # `load: true` because the scanner below reads it from the local daemon
      # rather than a registry — this image is built to be inspected, never
      # pushed.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/agent.Dockerfile
          tags: orchestrator-agent:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: scan container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orchestrator-agent:ci
          trivy-config: trivy.yaml
          # Same as the filesystem scan above: the action's environment defaults
          # override `trivy.yaml`, so the policy is stated where it is read.
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: table
      # What the gate above does not fail on, printed anyway.
      #
      # `ignore-unfixed` on the gate is not the same as not caring. An advisory
      # with no published fix cannot be acted on by the person whose pull
      # request is being blocked: the only ways out are changing base image or
      # dropping the package, which are decisions somebody makes deliberately
      # and not under a red check. Blocking on them teaches people to turn the
      # gate off, which costs the fixable ones too.
      #
      # But not blocking is only defensible if the list is visible, so this step
      # prints it on every run — 53 at the time it was added, all of them
      # `affected` or `fix_deferred` in Debian's own tracker. It is the same
      # arrangement `quality-fallow` uses for coverage gaps: reported, never
      # gated, and never silent.
      - name: report advisories with no fix available
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orchestrator-agent:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: table
          output: trivy-unfixed.txt
      - name: publish the unfixed list
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            echo '### Advisories with no fix available'
            echo
            echo 'Not gated: no published fix means nothing this pull request can do.'
            echo 'Acting on them means changing base image or dropping a package.'
            echo
            echo '```'
            tail -c 60000 trivy-unfixed.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: create container SPDX SBOM
        # Evidence for a release, not an answer a pull request needs: four SBOM
        # generations cost 28s per run and nothing gates on them. `release.yml`
        # produces its own from the exact source it publishes.
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orchestrator-agent:ci
          format: spdx-json
          output: trivy-image.spdx.json
          exit-code: '0'
      - name: create container CycloneDX SBOM
        # Evidence for a release, not an answer a pull request needs: four SBOM
        # generations cost 28s per run and nothing gates on them. `release.yml`
        # produces its own from the exact source it publishes.
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orchestrator-agent:ci
          format: cyclonedx
          output: trivy-image.cdx.json
          exit-code: '0'
      # Skipped with the SBOMs it uploads. `if-no-files-found: error` is right —
      # an upload that silently ships nothing is worse than one that fails — but
      # it means this step has to follow the same condition as its inputs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name != 'pull_request'
        with:
          name: security-sboms
          path: trivy-*.json
          if-no-files-found: error
          retention-days: 7

  workflow-static:
    name: workflow-static
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read # Verify actionlint release provenance.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: verify and run actionlint release
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check -
          gh attestation verify "$archive" --repo rhysd/actionlint
          tar -xzf "$archive" actionlint
          ./actionlint -color
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.2
          enable-cache: false
      - run: uvx --from zizmor==1.29.0 zizmor --pedantic .github/workflows
