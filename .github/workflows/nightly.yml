name: nightly

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.0
  TRIVY_VERSION: v0.74.0

jobs:
  test-stress:
    name: test-stress
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run build:web
      - run: bun run perf:bench
      - env:
          FC_NUM_RUNS: '1000'
        run: bun run test:stress

  security-full:
    name: security-full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun audit
      # `bun run audit` is not here, and the removal is the finding. It is scoped
      # to changed files by design, and this job runs on `main`, where the base is
      # `main` — so three consecutive nights printed `✓ No issues in 0 changed
      # files`, a green tick over nothing examined. The structural audit runs per
      # pull request in `ci.yml`, against a real diff and a real coverage file;
      # here it could only ever be a second owner reporting on an empty set. Run
      # from a branch it did fire, and with no coverage file every CRAP score
      # falls back to the export-reference estimate — 11 phantom complexity
      # findings, the trap `AGENTS.md` documents.
      - name: inventory all security candidates
        run: |
          bunx fallow security --surface --format json --quiet --output-file "$RUNNER_TEMP/fallow-security.json"
          bunx fallow report --from "$RUNNER_TEMP/fallow-security.json" --format github-summary >> "$GITHUB_STEP_SUMMARY"
      # The third call site, and the last one still scanning at the action's
      # policy rather than this repository's. See `scan verified image` in
      # `release.yml` for what that costs.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: table

  sandbox-live:
    name: sandbox-live
    runs-on: ubuntu-24.04
    # Six containers, each with an image, a clone and a toolchain in it. The
    # budget is for a cold runner that pulls two images and installs a Python
    # package before the first one starts.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # opensandbox-server is a Python package, and the tests start it with
      # `uvx`. Without uv on PATH they detect that and skip — a green tick on a
      # job named sandbox-live, over nothing.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # ubuntu-24.04 ships a running docker daemon, and the agent image is
      # published public (anonymous pull verified), so there is no install and no
      # registry secret. Both tags are read from the modules that name them: this
      # job fetches them *before* the server asks, because an image named in a
      # config is not an image docker has, and a tag pinned in two places is one
      # tag and one stale copy that this job would be the last to notice.
      - name: pull the images every sandbox is built from
        run: |
          # shellcheck disable=SC2016 # `${...}` is a JavaScript template literal read by `bun -e`, not a shell expansion. The single quotes are what keep the shell out of it, which is the point.
          bun -e 'import { DEFAULTS_FOR_CHECK as c } from "./src/platform/config/load.ts";
                  import { EGRESS_IMAGE } from "./src/mech/sandbox/server.ts";
                  console.log(`${c.sandbox.image}\n${EGRESS_IMAGE}`)' \
            | while read -r image; do docker pull "$image"; done
      # The first `uvx` of a package downloads and installs it, and the tests
      # give the server 45s from spawn to first answer. Paid here instead.
      - run: uvx opensandbox-server --help
      # `tee`, and a check that nothing skipped. The tests skip themselves when
      # this machine cannot run containers, which is right on a laptop and is
      # this job failing to do its one job — and a skip is not a non-zero exit.
      - name: the six live tests, and proof they ran
        env:
          ORCH_LIVE_SANDBOX: "1"
        run: |
          set -o pipefail
          bun run test test/live/ 2>&1 | tee "$RUNNER_TEMP/live.log"
          if grep -q ' skip' "$RUNNER_TEMP/live.log"; then
            echo '::error::live sandbox tests skipped — the reason is printed above'
            exit 1
          fi
