name: pr-report

# `ci` runs as `pull_request`, so a fork run has read-only permissions and no
# secrets by design. Writing a comment needs `pull-requests: write`, which that
# trigger can never grant. This workflow runs from the base repository after
# `ci` finishes, reads what `ci` uploaded as artifacts, and does the writing.
#
# `workflow_run` earns its privilege only because nothing here executes fork
# content: no checkout of the head ref, no build, no script from the artifacts.
# Artifact bytes are read as data and rendered into one comment.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

# One report per branch: a newer commit's report replaces the older one.
concurrency:
  group: pr-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  pr-report:
    name: pr-report
    # A cancelled upstream run has nothing to report: `ci` sets
    # `cancel-in-progress`, so every push after the first cancels the run
    # before it, and `workflow_run: completed` fires for each of those too.
    # Without the conclusion filter this workflow bills a job to download
    # artifacts that were never uploaded and post "uploaded no report
    # artifacts" over the comment the finished run is about to write.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write # Maintain the single sticky report comment.
      actions: read # Read the triggering run's artifacts.
      id-token: write # Codecov tokenless upload over OIDC.
    steps:
      - name: download the ci report artifacts
        continue-on-error: true # A run that died before any upload still gets a clean skip.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: report-*
          merge-multiple: true
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # `workflow_run` carries no pull-request number for a fork, so `ci` writes
      # it into every artifact and this reads it back.
      - name: read the pull request number
        id: pr
        run: |
          set -euo pipefail
          number=$(cat reports/pr-number.txt 2>/dev/null || true)
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo '::notice::no pull request number in the ci artifacts, nothing to report'
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: upload coverage to codecov
        if: steps.pr.outputs.number && hashFiles('reports/lcov.info') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          # Only the file named. Left to search, the CLI also finds
          # `coverage-final.json` beside it — an Istanbul map whose keys are the
          # runner's absolute paths, which match no file in the repository. Every
          # upload since this workflow was written parsed to `files: 0` and the
          # commit came back `state: error`, so `codecov/patch` was being decided
          # on an empty report and sometimes not posted at all — which is a
          # required check that silently is not there.
          disable_search: true
          files: reports/lcov.info
          override_commit: ${{ github.event.workflow_run.head_sha }}
          override_branch: ${{ github.event.workflow_run.head_branch }}
          override_pr: ${{ steps.pr.outputs.number }}
          fail_ci_if_error: true

      - name: upload test results to codecov
        if: steps.pr.outputs.number && hashFiles('reports/junit.xml') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          report_type: test_results
          disable_search: true
          files: reports/junit.xml
          override_commit: ${{ github.event.workflow_run.head_sha }}
          override_branch: ${{ github.event.workflow_run.head_branch }}
          override_pr: ${{ steps.pr.outputs.number }}
          fail_ci_if_error: true

      # Coverage numbers are deliberately absent: Codecov posts its own comment
      # for those, and two comments answering the same question is worse than one.
      - name: render the report comment
        if: steps.pr.outputs.number
        env:
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node - > comment.md <<'NODE'
          const fs = require("node:fs");
          const read = (path) => { try { return fs.readFileSync(path, "utf8"); } catch { return ""; } };
          const decode = (text) => text.replace(/&(quot|apos|amp|lt|gt|#39);/g, (_, name) =>
            ({ quot: '"', apos: "'", amp: "&", lt: "<", gt: ">", "#39": "'" })[name]);
          // A fork controls every byte in these artifacts. Nothing is executed, but a
          // backtick would still let a crafted test name escape its code span.
          const safe = (text) => decode(String(text)).replace(/[`\r]/g, "").slice(0, 300);
          const out = [];

          const junit = read("reports/junit.xml");
          if (junit) {
            const head = /<testsuites\b[^>]*>/.exec(junit)?.[0] ?? "";
            const attr = (name) => Number(new RegExp(`\\b${name}="([^"]*)"`).exec(head)?.[1] ?? 0);
            const [tests, failures, skipped] = [attr("tests"), attr("failures"), attr("skipped")];
            const passed = tests - failures - skipped;
            const rate = tests === 0 ? "0.00" : ((passed / tests) * 100).toFixed(2);
            out.push("### Tests", "");
            out.push(`${failures === 0 ? "PASS" : "FAIL"} — ${passed} passed, ${failures} failed, ` +
              `${skipped} skipped of ${tests} (${rate}% pass) in ${attr("time").toFixed(2)}s`);
            // A `<testcase>` is either self-closed or wraps its `<failure>`, so the
            // segment up to whichever terminator comes first belongs to that case.
            const failing = junit.split("<testcase").slice(1).flatMap((rest) => {
              const ends = [rest.indexOf("/>"), rest.indexOf("</testcase>")].filter((at) => at >= 0);
              const body = rest.slice(0, Math.min(...ends, rest.length));
              if (!body.includes("<failure")) return [];
              const name = /\bname="([^"]*)"/.exec(body)?.[1] ?? "unnamed";
              const file = /\bfile="([^"]*)"/.exec(body)?.[1] ?? "";
              return [`- \`${safe(file)}\` — ${safe(name)}`];
            });
            if (failing.length > 0) out.push("", ...failing.slice(0, 30));
            if (failing.length > 30) out.push(`- …and ${failing.length - 30} more`);
          }

          const audit = read("reports/fallow-audit.json");
          if (audit) {
            const report = JSON.parse(audit);
            const attribution = report.attribution ?? {};
            const categories = [...new Set(Object.keys(attribution)
              .filter((key) => /_(introduced|inherited)$/.test(key))
              .map((key) => key.replace(/_(introduced|inherited)$/, "")))];
            out.push("", "### Structure", "", `Fallow verdict: \`${safe(report.verdict ?? "unknown")}\``);
            if (categories.length > 0) {
              out.push("", "| category | introduced | inherited |", "| --- | --: | --: |");
              for (const category of categories)
                out.push(`| ${safe(category)} | ${Number(attribution[`${category}_introduced`]) || 0} ` +
                  `| ${Number(attribution[`${category}_inherited`]) || 0} |`);
            }
          }

          const budget = read("reports/budget.txt").trim();
          if (budget) out.push("", "### Size budgets", "", "```text", budget.replace(/`/g, ""), "```");

          if (out.length === 0) out.push("`ci` uploaded no report artifacts for this commit.");
          console.log([
            `## CI report — \`${process.env.RUN_CONCLUSION}\``,
            "",
            ...out,
            "",
            `[ci run](${process.env.RUN_URL}) for \`${process.env.HEAD_SHA}\`.`,
          ].join("\n"));
          NODE

      - name: post or update the report comment
        if: steps.pr.outputs.number
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: pr-report
          number: ${{ steps.pr.outputs.number }}
          path: comment.md
