name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already merged in package.json, without the v
        required: true
        type: string
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TRIVY_VERSION: v0.74.0

jobs:
  checks:
    name: verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read # Read the named CI and security results for the selected source SHA.
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: select immutable main source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo '::error::Releases only run from main.'; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || exit 1
          package_version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          test "$package_version" = "$RELEASE_VERSION" || { echo "::error::Merge the $RELEASE_VERSION bump PR first."; exit 1; }
          sha=$(git rev-parse HEAD)
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$sha" = "$main_sha" || { echo '::error::Selected SHA is not current main.'; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::v$RELEASE_VERSION is already published and immutable releases are not re-cut."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$RELEASE_VERSION" --jq .sha)
            test "$tag_sha" = "$sha" || {
              echo "::error::v$RELEASE_VERSION already points to $tag_sha, not selected source $sha."
              exit 1
            }
            echo "::notice::resuming the unpublished v$RELEASE_VERSION release at $sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - run: bun run check
      - run: git diff --exit-code
      - name: require successful source checks
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          # Read from `.github/required-checks.txt` rather than repeated here.
          # A release gate that keeps its own copy of the list is a release gate
          # that can silently stop requiring something CI still runs.
          mapfile -t required < <(grep -vE '^\s*(#|$)' .github/required-checks.txt)
          test "${#required[@]}" -gt 0 || { echo '::error::required-checks.txt is empty'; exit 1; }
          runs=$(mktemp)
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" > "$runs"
          failed=0
          for name in "${required[@]}"; do
            state=$(jq -r --arg name "$name" '
              [.check_runs[] | select(.name == $name)]
              | sort_by(.completed_at // .started_at // "")
              | last
              | if . == null then "missing" else "\(.status):\(.conclusion // "")" end
            ' "$runs")
            if [ "$state" != "completed:success" ]; then
              echo "::error::$name is $state for $SOURCE_SHA"
              failed=1
            fi
          done
          test "$failed" = 0

  binaries:
    name: build five binaries
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.source-sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run build:web
      - name: compile five platform archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.checks.outputs.source-sha }}
        run: |
          set -euo pipefail
          bun build --minify --target=bun --define "__ORCH_VERSION__=\"$RELEASE_VERSION\"" src/orch/cli.ts --outfile dist/orch-cli.ts
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            root="orch-server-$RELEASE_VERSION-$target"; exe=orch-server; bun_target="bun-$target"
            case "$target" in
              linux-x64) bun_target=bun-linux-x64-baseline ;;
              windows-x64) exe=orch-server.exe; bun_target=bun-windows-x64-baseline ;;
            esac
            mkdir -p "dist/$root/web" "dist/$root/src/orch"
            bun build --compile --minify --target="$bun_target" --define "__ORCH_VERSION__=\"$RELEASE_VERSION\"" src/composition/server.ts --outfile "dist/$root/$exe"
            cp -R roles config drizzle "dist/$root/"
            cp -R web/dist "dist/$root/web/dist"
            cp web/index.html web/icon.png web/favicon-32.png web/apple-touch-icon.png "dist/$root/web/"
            cp dist/orch-cli.ts "dist/$root/src/orch/cli.ts"
            cp package.json README.md LICENSE "dist/$root/"
            test "$(stat -c %s "dist/$root/$exe")" -le $((150 * 1024 * 1024)) || { echo "::error::$target binary exceeds 150 MiB"; exit 1; }
            # shellcheck disable=SC2016 # `${process.env.ROOT}` is a JavaScript template literal read by `bun -e`, not a shell expansion. The single quotes are what keep the shell out of it, which is the point: the value reaches the script through the environment, so it is never a word the shell has to parse.
            TARGET="$target" BUN_TARGET="$bun_target" ROOT="$root" bun -e 'await Bun.write(`dist/${process.env.ROOT}/release-manifest.json`, JSON.stringify({version:process.env.RELEASE_VERSION,source_sha:process.env.SOURCE_SHA,target:process.env.TARGET,bun_target:process.env.BUN_TARGET},null,2)+"\n")'
            case "$target" in windows-*) (cd dist && zip -qr "orch-server-$target.zip" "$root") ;; *) tar -C dist -czf "dist/orch-server-$target.tar.gz" "$root" ;; esac
            rm -rf "dist/$root"
          done
          rm dist/orch-cli.ts
      - name: verify archives, version, source, and target manifests
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.checks.outputs.source-sha }}
        run: |
          set -euo pipefail
          verify=$(mktemp -d); trap 'rm -rf "$verify"' EXIT
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do tar -xzf "dist/orch-server-$target.tar.gz" -C "$verify"; done
          unzip -q dist/orch-server-windows-x64.zip -d "$verify"
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            root="$verify/orch-server-$RELEASE_VERSION-$target"; exe=orch-server; bun_target="bun-$target"
            case "$target" in
              linux-x64) bun_target=bun-linux-x64-baseline ;;
              windows-x64) exe=orch-server.exe; bun_target=bun-windows-x64-baseline ;;
            esac
            required=(
              "$exe" package.json README.md LICENSE release-manifest.json
              src/orch/cli.ts config/default.yaml web/index.html web/icon.png
              web/favicon-32.png web/apple-touch-icon.png web/dist/main.js web/dist/app.css
            )
            for path in "${required[@]}"; do test -e "$root/$path" || { echo "::error::$target archive is missing $path"; exit 1; }; done
            test -d "$root/roles" || { echo "::error::$target archive is missing roles"; exit 1; }
            # The schema. `migrate()` reads this folder at boot, so an archive
            # without it starts and then cannot open its own database.
            test -n "$(find "$root/drizzle" -name migration.sql -print -quit 2>/dev/null)" || {
              echo "::error::$target archive is missing drizzle migrations"; exit 1; }
            test "$(bun "$root/src/orch/cli.ts" --version)" = "$RELEASE_VERSION"
            # shellcheck disable=SC2016 # Same as above: a JavaScript template literal inside `bun -e`, with the path arriving through `ROOT` in the environment.
            ROOT="$root" bun -e 'const p=await Bun.file(`${process.env.ROOT}/package.json`).json();if(p.version!==process.env.RELEASE_VERSION)process.exit(1)'
            TARGET="$target" BUN_TARGET="$bun_target" MANIFEST="$root/release-manifest.json" bun -e 'const m=await Bun.file(process.env.MANIFEST).json();if(m.version!==process.env.RELEASE_VERSION||m.source_sha!==process.env.SOURCE_SHA||m.target!==process.env.TARGET||m.bun_target!==process.env.BUN_TARGET)process.exit(1)'
          done
      - name: start the native Linux archive
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          smoke=$(mktemp -d); trap 'test -z "${pid:-}" || kill "$pid" 2>/dev/null || true; rm -rf "$smoke"' EXIT
          tar -xzf dist/orch-server-linux-x64.tar.gz -C "$smoke"
          root="$smoke/orch-server-$RELEASE_VERSION-linux-x64"
          test "$("$root/orch-server" --version)" = "$RELEASE_VERSION"
          ORCH_DATA_DIR="$smoke/data" ORCH_PORT=18080 "$root/orch-server" >"$smoke/server.log" 2>&1 & pid=$!
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null && exit 0
            kill -0 "$pid" 2>/dev/null || { cat "$smoke/server.log"; exit 1; }
            sleep 1
          done
          cat "$smoke/server.log"; exit 1
      - run: bun run perf:budget
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-binaries
          path: |
            dist/orch-server-*.tar.gz
            dist/orch-server-*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  source-sbom:
    name: build source SBOMs
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.source-sha }}
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { version: '${{ env.TRIVY_VERSION }}', scan-type: fs, scan-ref: ., format: spdx-json, output: orchestrator-source.spdx.json, exit-code: '0' }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { version: '${{ env.TRIVY_VERSION }}', scan-type: fs, scan-ref: ., format: cyclonedx, output: orchestrator-source.cdx.json, exit-code: '0' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: source-sboms, path: 'orchestrator-source.*.json', if-no-files-found: error, retention-days: 1 }

  image-build:
    name: build and verify image (${{ matrix.platform }})
    needs: checks
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix: { platform: [amd64, arm64] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ needs.checks.outputs.source-sha }}', persist-credentials: false }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/agent.Dockerfile
          platforms: linux/${{ matrix.platform }}
          load: true
          push: false
          tags: orch-agent:verify-${{ matrix.platform }}
          provenance: mode=max
          cache-from: type=gha,scope=orch-agent-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=orch-agent-${{ matrix.platform }}
      - name: verify image digest and provenance material
        env:
          BUILD_METADATA: ${{ steps.image.outputs.metadata }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ needs.checks.outputs.source-sha }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          printf '%s\n' "$BUILD_METADATA" > "build-provenance-$PLATFORM.json"
          jq -e --arg digest "$IMAGE_DIGEST" '
            .["containerimage.digest"] == $digest and has("buildx.build.provenance")
          ' "build-provenance-$PLATFORM.json" >/dev/null
          image_id=$(docker image inspect --format '{{.Id}}' "orch-agent:verify-$PLATFORM")
          test -n "$image_id"
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg platform "linux/$PLATFORM" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg image_id "$image_id" \
            '{source_sha:$source_sha,platform:$platform,image_digest:$image_digest,image_id:$image_id}' \
            > "image-manifest-$PLATFORM.json"
      - name: scan verified image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orch-agent:verify-${{ matrix.platform }}
          trivy-config: trivy.yaml
          format: table
      - name: create verified image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orch-agent:verify-${{ matrix.platform }}
          format: spdx-json
          output: orchestrator-agent-${{ matrix.platform }}.spdx.json
          exit-code: '0'
      - name: create verified image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orch-agent:verify-${{ matrix.platform }}
          format: cyclonedx
          output: orchestrator-agent-${{ matrix.platform }}.cdx.json
          exit-code: '0'
      - name: save verified image for publication
        if: ${{ !inputs.dry_run }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: docker save "orch-agent:verify-$PLATFORM" | gzip -1 > "orch-agent-$PLATFORM.docker.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-evidence-${{ matrix.platform }}
          path: |
            build-provenance-${{ matrix.platform }}.json
            image-manifest-${{ matrix.platform }}.json
            orchestrator-agent-${{ matrix.platform }}.spdx.json
            orchestrator-agent-${{ matrix.platform }}.cdx.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !inputs.dry_run }}
        with:
          name: image-archive-${{ matrix.platform }}
          path: orch-agent-${{ matrix.platform }}.docker.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  image-push:
    name: publish verified image digest (${{ matrix.platform }})
    needs: [checks, image-build]
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Push only the image archive that passed local scan and provenance checks.
    strategy:
      fail-fast: true
      matrix: { platform: [amd64, arm64] }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: 'image-archive-${{ matrix.platform }}', path: image }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: 'image-evidence-${{ matrix.platform }}', path: image }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: push only the image that passed verification
        env:
          IMAGE: ${{ env.REGISTRY }}/orch-agent
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ needs.checks.outputs.source-sha }}
        run: |
          set -euo pipefail
          gzip -dc "image/orch-agent-$PLATFORM.docker.tar.gz" | docker load
          loaded_id=$(docker image inspect --format '{{.Id}}' "orch-agent:verify-$PLATFORM")
          expected_id=$(jq -r .image_id "image/image-manifest-$PLATFORM.json")
          test "$loaded_id" = "$expected_id" || { echo "::error::loaded image ID $loaded_id differs from verified image ID $expected_id"; exit 1; }
          stage="$IMAGE:sha-$SOURCE_SHA-$PLATFORM"
          remote=$(docker buildx imagetools inspect "$stage" --raw 2>/dev/null || true)
          if [ -n "$remote" ]; then
            remote_id=$(jq -r '.config.digest // empty' <<<"$remote")
            test "$remote_id" = "$loaded_id" || {
              echo "::error::$stage already exists with config $remote_id, not verified config $loaded_id"
              exit 1
            }
          else
            docker tag "orch-agent:verify-$PLATFORM" "$stage"
            docker push "$stage" >/dev/null
          fi
          remote=$(docker buildx imagetools inspect "$stage" --raw)
          remote_id=$(jq -r '.config.digest // empty' <<<"$remote")
          test "$remote_id" = "$loaded_id" || { echo "::error::$stage changed while it was staged"; exit 1; }
          digest=$(docker buildx imagetools inspect "$stage" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::staged image has no immutable digest"; exit 1; }
          mkdir -p /tmp/digests
          touch "/tmp/digests/$PLATFORM-${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: 'image-digest-${{ matrix.platform }}', path: '/tmp/digests/*', if-no-files-found: error, retention-days: 1 }

  manifest:
    name: publish image manifest and attestations
    needs: [checks, image-push]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      previous-latest: ${{ steps.manifest.outputs.previous-latest }}
    permissions:
      contents: read
      packages: write # Join the two verified platform digests into immutable registry tags.
      id-token: write # Request the OIDC identity used to sign registry attestations.
      attestations: write # Publish provenance and SBOM attestations for the image digest.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { path: /tmp/digests, pattern: 'image-digest-*', merge-multiple: true }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: create multi-platform manifest
        id: manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/orch-agent
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.checks.outputs.source-sha }}
        run: |
          set -euo pipefail
          image="$IMAGE"
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'
          }
          promote() {
            local destination="$1" expected="$2" source="$3" existing
            existing=$(digest_of "$destination" || true)
            if [ -n "$existing" ] && [ "$existing" != "$expected" ]; then
              echo "::error::$destination already points to $existing, not verified digest $expected"
              return 1
            fi
            if [ -z "$existing" ]; then
              docker buildx imagetools create -t "$destination" "$source"
            fi
            test "$(digest_of "$destination")" = "$expected" || {
              echo "::error::$destination changed during promotion"
              return 1
            }
          }

          previous_latest=$(digest_of "$image:latest" || true)
          declare -a refs=() expected_members=()
          for platform in amd64 arm64; do
            file=$(find . -maxdepth 1 -type f -name "$platform-*" -print -quit)
            test -n "$file" || { echo "::error::missing staged digest for $platform"; exit 1; }
            platform_digest="sha256:${file##*-}"
            [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            stage="$image:sha-$SOURCE_SHA-$platform"
            test "$(digest_of "$stage")" = "$platform_digest" || {
              echo "::error::$stage no longer matches the verified digest"
              exit 1
            }
            refs+=("$image@$platform_digest")
            expected_members+=("$platform_digest")
            promote "$image:$RELEASE_VERSION-$platform" "$platform_digest" "$image@$platform_digest"
          done

          stage_manifest="$image:sha-$SOURCE_SHA"
          if ! digest_of "$stage_manifest" >/dev/null; then
            docker buildx imagetools create -t "$stage_manifest" "${refs[@]}"
          fi
          actual_members=$(docker buildx imagetools inspect "$stage_manifest" --raw | jq -r '.manifests[].digest' | sort)
          wanted_members=$(printf '%s\n' "${expected_members[@]}" | sort)
          test "$actual_members" = "$wanted_members" || {
            echo "::error::$stage_manifest exists with divergent platform digests"
            exit 1
          }
          digest=$(digest_of "$stage_manifest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          promote "$image:$RELEASE_VERSION" "$digest" "$image@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "previous-latest=$previous_latest" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg image "$image" \
            --arg digest "$digest" \
            '{source_sha:$source_sha,image:$image,digest:$digest,platforms:["linux/amd64","linux/arm64"]}' \
            > "$GITHUB_WORKSPACE/registry-image-manifest.json"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { version: '${{ env.TRIVY_VERSION }}', image-ref: '${{ env.REGISTRY }}/orch-agent:${{ inputs.version }}', trivy-config: trivy.yaml, format: table }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { version: '${{ env.TRIVY_VERSION }}', image-ref: '${{ env.REGISTRY }}/orch-agent:${{ inputs.version }}', format: spdx-json, output: registry-image.spdx.json, exit-code: '0' }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { version: '${{ env.TRIVY_VERSION }}', image-ref: '${{ env.REGISTRY }}/orch-agent:${{ inputs.version }}', format: cyclonedx, output: registry-image.cdx.json, exit-code: '0' }
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with: { subject-name: '${{ env.REGISTRY }}/orch-agent', subject-digest: '${{ steps.manifest.outputs.digest }}', push-to-registry: true }
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with: { subject-name: '${{ env.REGISTRY }}/orch-agent', subject-digest: '${{ steps.manifest.outputs.digest }}', sbom-path: registry-image.spdx.json, push-to-registry: true }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registry-image-evidence
          path: |
            registry-image-manifest.json
            registry-image.spdx.json
            registry-image.cdx.json
          if-no-files-found: error
          retention-days: 1

  release-evidence:
    name: verify complete release evidence
    needs: [checks, binaries, source-sbom, image-build, image-push, manifest]
    if: ${{ always() && needs.checks.result == 'success' && needs.binaries.result == 'success' && needs.source-sbom.result == 'success' && needs.image-build.result == 'success' && (inputs.dry_run || (needs.image-push.result == 'success' && needs.manifest.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: release-binaries, path: dist }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: source-sboms, path: dist }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { path: dist, pattern: 'image-evidence-*', merge-multiple: true }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: ${{ !inputs.dry_run }}
        with: { name: registry-image-evidence, path: dist }
      - name: checksum every release artifact
        run: |
          set -euo pipefail
          (
            cd dist
            # shellcheck disable=SC2094 # The pipeline does not read the file it writes: `! -name SHA256SUMS` is exactly the guard SC2094 is looking for, and it is why the checksum file can be regenerated in place without listing itself.
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: publish immutable GitHub release
    needs: [checks, release-evidence, manifest]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Create the tag and GitHub release only after every evidence gate passes.
      id-token: write # Request the OIDC identity used to sign artifact attestations.
      attestations: write # Attest every file attached to the GitHub release.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: release-evidence, path: dist }
      - name: verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: atomically bind release tag to verified source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.checks.outputs.source-sha }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$SOURCE_SHA" >/dev/null 2>&1; then
            existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            test "$existing" = "$SOURCE_SHA" || {
              echo "::error::$tag was raced to $existing, expected $SOURCE_SHA"
              exit 1
            }
          fi
          resolved=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          test "$resolved" = "$SOURCE_SHA" || { echo "::error::$tag does not resolve to verified source"; exit 1; }
      - name: create release at the verified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.checks.outputs.source-sha }}
        run: gh release create "v$RELEASE_VERSION" dist/* --verify-tag --title "v$RELEASE_VERSION" --generate-notes

  promote-latest:
    name: promote latest after release publication
    needs: [manifest, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # Advance latest only after the immutable GitHub release exists.
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: promote the published manifest to latest
        env:
          EXPECTED_DIGEST: ${{ needs.manifest.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/orch-agent
          PREVIOUS_LATEST: ${{ needs.manifest.outputs.previous-latest }}
        run: |
          set -euo pipefail
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'
          }
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          test "$(digest_of "$IMAGE@$EXPECTED_DIGEST")" = "$EXPECTED_DIGEST" || {
            echo "::error::verified manifest $EXPECTED_DIGEST is no longer readable"
            exit 1
          }
          current=$(digest_of "$IMAGE:latest" || true)
          if [ "$current" != "$EXPECTED_DIGEST" ]; then
            test "$current" = "$PREVIOUS_LATEST" || {
              echo "::error::$IMAGE:latest changed from $PREVIOUS_LATEST to $current before promotion"
              exit 1
            }
            docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$EXPECTED_DIGEST"
          fi
          test "$(digest_of "$IMAGE:latest")" = "$EXPECTED_DIGEST" || {
            echo "::error::$IMAGE:latest does not match the published release"
            exit 1
          }
