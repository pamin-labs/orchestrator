# Cut a release, by hand, on purpose.
#
# Not on a tag push and not on a merge: a release is the one moment this project
# says "this is the version to run", and that is a decision rather than a
# consequence of landing a commit. So it is `workflow_dispatch`, it takes the
# version from you, and it refuses to overwrite one that already exists.
#
# What it does, in order, and it stops at the first failure:
#
#   1. runs every check and cross-compiles the four tarballs, in one job
#   2. builds the agent image, one job per platform, merged into one manifest
#   3. tags the commit
#   4. publishes a release, with the notes GitHub generates itself
#
# Step 4 is `--generate-notes`, and that is the whole of it. GitHub already
# knows which pull requests merged since the previous tag and which of their
# authors had never merged one before — that is the feature — so neither a
# third-party action nor a script of ours has any work left to do.
#
# **On the shape of step 2**, because it is the whole cost of a release. This was
# one job building `linux/amd64,linux/arm64` in a single step, which means arm64
# under QEMU: every instruction of `bun install` and `bun build --compile`
# emulated. Now each platform builds on a runner of its own architecture —
# `ubuntu-24.04-arm` is free for public repositories — and `imagetools create`
# joins the two digests into one manifest without rebuilding anything. More jobs,
# less wall clock *and* fewer billed minutes, because emulation was paying
# several times over for the same work.
#
# **On step 3, and why there is no orchestrator image.** There was one, and it
# created the problem it was meant to avoid. `opensandbox-server` hands bind
# mount paths to the *host's* docker daemon, so a path inside the orchestrator's
# own container means nothing to it: the mount succeeds and delivers an empty
# directory, and every skill the boss ticked silently does not exist. An image
# also cannot be given the docker socket without making "can open the panel" and
# "root on the host" the same sentence, since the panel has no login.
#
# A compiled binary has none of that — it runs on the host, so the paths it names
# are the paths the daemon means. `bun build --compile` cross-compiles, so all
# four targets come out of one ubuntu job in seconds rather than four image
# builds across two architectures. Docker is still required; it is required for
# the *sandboxes*, which is what it was always for.
#
# Release notes are English. The panel speaks whatever `output.language` says,
# but a release is read by whoever finds the repository, and the PR titles it is
# built from are English already (CLAUDE.md: code, commits and PR titles are).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, without the v (e.g. 0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and print the notes, publish nothing'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # Everything that can say no, before anything is built or pushed.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `git rev-parse` on the tag below needs the tags, and a shallow clone
          # has none of them.
          fetch-depth: 0

      - name: reject a version that already exists
        run: |
          v="v${{ inputs.version }}"
          if git rev-parse "$v" >/dev/null 2>&1; then
            echo "::error::$v already exists. A published version is not re-cut; pick the next one."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Before the checks, because the tarballs are built in this job now and
      # `package.json` is what the running orchestrator reads its own version
      # from — it is on the line every pull request carries.
      - name: set the version
        run: |
          node -e '
            const p = require("./package.json");
            p.version = "${{ inputs.version }}";
            require("fs").writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            console.log("package.json -> " + p.version);
          '

      # bun's global download cache, not `node_modules`: what an install spends
      # is the network, and this is keyed by the lockfile so a release that
      # changed no dependency restores exactly what the last one downloaded.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # `--frozen-lockfile`: a lockfile that does not match package.json is a
      # difference between what was tested and what will run.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bunx oxlint --deny-warnings src web/src test
      # Build before test, for the reason ci.yml states: the smoke test asserts
      # the built bundle is served, and with no `web/dist` it fails as a 404.
      - run: bun run build:web
      - run: bun test

      # In this job rather than one of its own, and the reason is the two lines
      # above it: a separate job repeats `bun install` and `bun run build:web`
      # for the same tree, which is more time than the compile itself takes.
      # `bun build --compile` cross-compiles, so one ubuntu runner emits all four
      # targets — no macOS runner, no arm runner, a few seconds each.
      - name: compile
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          # Every target bun can compile for. No `windows-arm64` — bun does not
          # build one — and no `-baseline` variants: those are for x64 CPUs
          # without AVX2, which is pre-2013, and two more artifacts is a worse
          # trade than an issue from whoever has one.
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            # The directory carries the version; the archive does not, because
            # `/releases/latest/download/<name>` only resolves for a fixed name —
            # and a download URL nobody has to edit per release is the whole
            # point of that endpoint.
            out="orch-server-$v-$target"
            exe="orch-server"
            case "$target" in windows-*) exe="orch-server.exe" ;; esac
            mkdir -p "dist/$out/web" "dist/$out/src/orch"
            bun build --compile --minify --target="bun-$target" src/server.ts \
              --outfile "dist/$out/$exe"
            # `ROOT` is the executable's own directory for a compiled binary — a
            # bundled module has no path on disk to resolve from — so everything
            # read at runtime travels beside it.
            cp -R roles config "dist/$out/"
            cp -R web/dist "dist/$out/web/dist"
            cp web/index.html web/icon.png web/favicon-32.png web/apple-touch-icon.png "dist/$out/web/"
            # Read at runtime *and* copied into every sandbox, so the agents' CLI
            # always matches the orchestrator serving them.
            cp src/orch/cli.ts "dist/$out/src/orch/"
            cp package.json README.md LICENSE "dist/$out/"
            # zip for Windows, which has no tar in every shell and treats a
            # `.tar.gz` as two steps.
            case "$target" in
              windows-*) (cd dist && zip -qr "orch-server-$target.zip" "$out") ;;
              *) tar -C dist -czf "dist/orch-server-$target.tar.gz" "$out" ;;
            esac
            rm -rf "dist/$out"
          done
          ls -lh dist/orch-server-*

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1


  # One job per image per architecture, each on a runner of that architecture.
  # Pushed by digest with no tag: a tag here would publish half a release the
  # moment the first job finished, and anyone pulling `:latest` in between would
  # get whichever platform won the race.
  build:
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        image: [orch-agent]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
          - image: orch-agent
            file: docker/agent.Dockerfile
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # `package.json` is where the running orchestrator reads its own version —
      # it is on the line every pull request carries. Left unbumped, a release
      # ships an image tagged 0.2.0 whose PRs say 0.1.0, and the mismatch is only
      # ever noticed by whoever is debugging one of those PRs.
      #
      # Repeated in every job that builds rather than passed between them: it is
      # one deterministic edit from one input, and an artifact carrying a two-line
      # file between jobs costs more than the edit.
      - name: set the version
        run: |
          node -e '
            const p = require("./package.json");
            p.version = "${{ inputs.version }}";
            require("fs").writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            console.log("package.json -> " + p.version);
          '

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.platform }}
          # One layer's cache key, so every release picks up the current CLIs
          # while the apt layer above stays cached.
          build-args: |
            CLI_REFRESH=${{ inputs.version }}
          # By digest; the manifest job below is what gives these names.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ !inputs.dry_run }}
          # Per image *and* per architecture. One shared scope means the two
          # platforms evict each other's layers every run — a cache that costs
          # upload time and never hits.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      # Named after the digest, so two jobs writing into one artifact cannot
      # collide.
      - name: hand the digest on
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.dry_run }}
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The two digests of one image, joined under the tags people actually pull.
  # Nothing is built here — `imagetools create` writes a manifest list out of
  # images already in the registry.
  manifest:
    needs: build
    if: ${{ !inputs.dry_run }}
    strategy:
      matrix:
        image: [orch-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: join them
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ matrix.image }}:${{ inputs.version }} \
            -t ${{ env.REGISTRY }}/${{ matrix.image }}:latest \
            $(printf '${{ env.REGISTRY }}/${{ matrix.image }}@sha256:%s ' *)
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ matrix.image }}:${{ inputs.version }}

  # Last, so a failed build never leaves a tag pointing at a release whose images
  # do not exist.
  publish:
    needs: [manifest, checks]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      # `main` is protected and nothing pushes there directly — including this
      # workflow, whose `GITHUB_TOKEN` GitHub refuses to accept as a bypass actor
      # at all ("must be part of the ruleset source or owner organization"). Our
      # own App can be, and is: `orchestrator-agentic-app`, installed on this
      # org, already holding `contents: write` because it is what the agents push
      # branches with.
      #
      # So the tag and the bump are pushed as the App, which the ruleset lets
      # through. v0.1.1 is what this is for: tagged, published, and `main` left
      # saying 0.1.0 because the push was refused after everything else worked.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.ORCH_APP_ID }}
          private-key: ${{ secrets.ORCH_APP_KEY }}

      - uses: actions/checkout@v7
        with:
          # The notes are computed from the range since the previous tag, so the
          # tags have to be here.
          fetch-depth: 0
          # Persisted so `git push` below uses it without a second remote.
          token: ${{ steps.app.outputs.token }}

      - name: set the version
        run: |
          node -e '
            const p = require("./package.json");
            p.version = "${{ inputs.version }}";
            require("fs").writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '

      # The tag first, and on the commit this run actually built — not on
      # whatever `main` says by now. The first attempt failed here: `main` moved
      # while the four image jobs were running, so `git push HEAD:main` was a
      # non-fast-forward, `bash -e` stopped the step, and the tag was never
      # created. Four builds paid for, nothing published, and the version still
      # free only by luck.
      #
      # So the two are separated. The tag is the release and must point at the
      # tree the images came from; moving the bump onto `main` is bookkeeping,
      # and bookkeeping may not fail a release that has already been built.
      - name: tag it
        run: |
          v="v${{ inputs.version }}"
          # The App's own bot account, so the commit is attributable to the
          # thing that made it and `dco` recognises it as a bot.
          git config user.name  "orchestrator-agentic-app[bot]"
          git config user.email "317244264+orchestrator-agentic-app[bot]@users.noreply.github.com"
          # Only when there is a bump to make: `package.json` may already carry
          # this version, and `git commit -am` on a clean tree exits non-zero —
          # which under `bash -e` would lose the tag over a file that was already
          # correct. `-s`, because `dco` is a required check and a tagged commit
          # that cannot be merged back is a tag nobody can build on.
          if ! git diff --quiet; then
            git commit -q -s -am "chore(release): ${{ inputs.version }}"
          fi
          git tag "$v"
          git push origin "$v"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "BUMP=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: publish the release
        env:
          # The App's token, like everything else here: a release created by the
          # same identity that pushed the tag reads as one act rather than two.
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Written a line at a time rather than as one indented string: this
          # script is inside a YAML block scalar, so every leading space in a
          # multi-line argument ends up in the release body — and ten spaces in
          # front of ```bash is an indented code block, which renders the fence
          # markers as text.
          base="https://github.com/${{ github.repository }}/releases/latest/download"
          printf '%s\n' \
            '### Linux' \
            '' \
            '```bash' \
            "curl -fsSL $base/orch-server-linux-x64.tar.gz | tar xz   # or -arm64" \
            'cd orch-server-*-linux-x64 && ./orch-server' \
            '```' \
            '' \
            '### macOS' \
            '' \
            '```bash' \
            "curl -fsSL $base/orch-server-darwin-arm64.tar.gz | tar xz   # or -x64" \
            'cd orch-server-*-darwin-arm64' \
            'xattr -dr com.apple.quarantine .   # unsigned; Gatekeeper otherwise refuses' \
            './orch-server' \
            '```' \
            '' \
            '### Windows' \
            '' \
            '```powershell' \
            "Invoke-WebRequest -Uri $base/orch-server-windows-x64.zip -OutFile orch.zip" \
            'Expand-Archive .\orch.zip -DestinationPath .' \
            'cd orch-server-*-windows-x64' \
            '.\orch-server.exe' \
            '```' \
            '' \
            'The sandbox server is Linux-only, so on Windows it runs under WSL — `uvx opensandbox-server` in there. Drive-letter paths are translated for it (`C:\orch\skills` is `/mnt/c/orch/skills` on its side), and that translated form is what goes in its `allowed_host_paths`; the panel prints the exact line.' \
            '' \
            '---' \
            '' \
            'It prints its own address on the way up — loopback, no login in front of it. `ORCH_HOST` and `ORCH_PORT` move it. Docker is needed for the sandboxes; nothing else is.' \
            '' \
            "The agent image (\`${{ env.REGISTRY }}/orch-agent:${{ inputs.version }}\`) is pulled by the sandbox server the first time it builds a container. Nothing to pull by hand." \
            > /tmp/notes.md
          gh release create "${{ env.VERSION }}" \
            --title "${{ env.VERSION }}" \
            --generate-notes \
            --notes-file /tmp/notes.md \
            dist/*.tar.gz dist/*.zip

      # Bookkeeping, and still allowed to fail: the release exists the moment the
      # tag does, so losing a race for `main` must not report a published version
      # as broken. That is the failure this step caused once already, in the
      # other direction.
      - name: carry the bump onto main
        continue-on-error: true
        run: |
          git fetch origin main
          # Replay just the bump. A merge would drag this run's base commit along
          # with it and rewrite what `main` is; a cherry-pick moves one file.
          git checkout -q -B main origin/main
          if git cherry-pick "${{ env.BUMP }}"; then
            git push origin main
          else
            git cherry-pick --abort || true
            echo "::warning::main already carries a different ${{ inputs.version }}; left alone"
          fi
