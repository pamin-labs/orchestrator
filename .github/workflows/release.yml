# Manual release: fix and format, bump with the App bot, validate, then fan out
# binary and native-architecture image builds. The tag is pushed only after all
# artifacts exist; GitHub generates the changelog from merged pull requests.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, without the v (e.g. 0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and print the notes, publish nothing'
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # Everything that can say no, before anything is built or pushed.
  checks:
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `git rev-parse` on the tag below needs the tags, and a shallow clone
          # has none of them.
          fetch-depth: 0
          persist-credentials: false

      - name: reject a version that already exists
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$RELEASE_VERSION is not a version such as 0.2.0 or 0.2.0-rc.1"
            exit 1
          fi
          v="v$RELEASE_VERSION"
          if git rev-parse "$v" >/dev/null 2>&1; then
            echo "::error::$v already exists. A published version is not re-cut; pick the next one."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun's global download cache, not `node_modules`: what an install spends
      # is the network, and this is keyed by the lockfile so a release that
      # changed no dependency restores exactly what the last one downloaded.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # `--frozen-lockfile`: a lockfile that does not match package.json is a
      # difference between what was tested and what will run.
      - run: bun install --frozen-lockfile

      - name: apply safe Fallow fixes and format
        run: |
          bun run audit:fix
          git restore --source=HEAD -- .fallowrc.json
          bun run format
          git diff --check

      - name: set the version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bun pm pkg set "version=$RELEASE_VERSION"

      - name: audit release code
        uses: fallow-rs/fallow@v3
        with:
          command: audit
      - run: bun run validate

      - name: detect release changes
        id: changes
        run: |
          git diff --stat
          echo "changed=$(git diff --quiet && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v3
        id: cleanup-token
        if: steps.changes.outputs.changed == 'true' && !inputs.dry_run
        with:
          app-id: ${{ vars.ORCH_APP_ID }}
          private-key: ${{ secrets.ORCH_APP_KEY }}

      - name: commit release changes
        if: steps.cleanup-token.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TOKEN: ${{ steps.cleanup-token.outputs.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'orchestrator-agentic-app[bot]'
          git config user.email '317244264+orchestrator-agentic-app[bot]@users.noreply.github.com'
          git add --all
          git commit --no-verify -s -m "chore(release): ${RELEASE_VERSION}"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --no-verify origin "HEAD:${TARGET_BRANCH}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: select the source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  binaries:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.checks.outputs.source-sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: set the version for a dry run
        if: inputs.dry_run
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bun pm pkg set "version=$RELEASE_VERSION"
      - run: bun run build:web
      - name: compile
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            out="orch-server-$RELEASE_VERSION-$target"
            exe="orch-server"
            case "$target" in windows-*) exe="orch-server.exe" ;; esac
            mkdir -p "dist/$out/web" "dist/$out/src/orch"
            bun build --compile --minify --target="bun-$target" src/server.ts --outfile "dist/$out/$exe"
            cp -R roles config "dist/$out/"
            cp -R web/dist "dist/$out/web/dist"
            cp web/index.html web/icon.png web/favicon-32.png web/apple-touch-icon.png "dist/$out/web/"
            cp src/orch/cli.ts "dist/$out/src/orch/"
            cp package.json README.md LICENSE "dist/$out/"
            case "$target" in
              windows-*) (cd dist && zip -qr "orch-server-$target.zip" "$out") ;;
              *) tar -C dist -czf "dist/orch-server-$target.tar.gz" "$out" ;;
            esac
            rm -rf "dist/$out"
          done
          ls -lh dist/orch-server-*
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0


  # One job per image per architecture, each on a runner of that architecture.
  # Pushed by digest with no tag: a tag here would publish half a release the
  # moment the first job finished, and anyone pulling `:latest` in between would
  # get whichever platform won the race.
  build:
    needs: checks
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [orch-agent]
        platform: [amd64, arm64]
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.checks.outputs.source-sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/agent.Dockerfile
          platforms: linux/${{ matrix.platform }}
          # One layer's cache key, so every release picks up the current CLIs
          # while the apt layer above stays cached.
          build-args: |
            CLI_REFRESH=${{ inputs.version }}
          # By digest; the manifest job below is what gives these names.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ !inputs.dry_run }}
          # Per image *and* per architecture. One shared scope means the two
          # platforms evict each other's layers every run — a cache that costs
          # upload time and never hits.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}

      # Named after the digest, so two jobs writing into one artifact cannot
      # collide.
      - name: hand the digest on
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.dry_run }}
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The two digests of one image, joined under the tags people actually pull.
  # Nothing is built here — `imagetools create` writes a manifest list out of
  # images already in the registry.
  manifest:
    needs: build
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [orch-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: join them
        working-directory: /tmp/digests
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ matrix.image }}:$RELEASE_VERSION \
            -t ${{ env.REGISTRY }}/${{ matrix.image }}:latest \
            $(printf '${{ env.REGISTRY }}/${{ matrix.image }}@sha256:%s ' *)
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ matrix.image }}:$RELEASE_VERSION

  # Last, so a failed build never leaves a tag pointing at a release whose images
  # do not exist.
  publish:
    needs: [manifest, binaries, checks]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      # The App is the branch-protection bypass actor and owns the release.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.ORCH_APP_ID }}
          private-key: ${{ secrets.ORCH_APP_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.checks.outputs.source-sha }}
          token: ${{ steps.app.outputs.token }}

      # Verify every archive before creating the irreversible tag.
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - name: the archives are here
        run: |
          ls -lh dist/
          missing=0
          for f in linux-x64.tar.gz linux-arm64.tar.gz darwin-x64.tar.gz darwin-arm64.tar.gz windows-x64.zip; do
            [ -s "dist/orch-server-$f" ] || { echo "::error::dist/orch-server-$f is missing or empty"; missing=1; }
          done
          [ "$missing" = 0 ]

      - name: tag it
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          v="v$RELEASE_VERSION"
          # The App's own bot account, so the commit is attributable to the
          # thing that made it and `dco` recognises it as a bot.
          git config user.name  "orchestrator-agentic-app[bot]"
          git config user.email "317244264+orchestrator-agentic-app[bot]@users.noreply.github.com"
          git tag "$v"
          git push origin "$v"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "BUMP=${{ needs.checks.outputs.source-sha }}" >> "$GITHUB_ENV"

      - name: publish the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/latest/download"
          printf '%s\n' \
            '### Linux' \
            '' \
            '```bash' \
            "curl -fsSL $base/orch-server-linux-x64.tar.gz | tar xz   # or -arm64" \
            'cd orch-server-*-linux-x64 && ./orch-server' \
            '```' \
            '' \
            '### macOS' \
            '' \
            '```bash' \
            "curl -fsSL $base/orch-server-darwin-arm64.tar.gz | tar xz   # or -x64" \
            'cd orch-server-*-darwin-arm64' \
            'xattr -dr com.apple.quarantine .   # unsigned; Gatekeeper otherwise refuses' \
            './orch-server' \
            '```' \
            '' \
            '### Windows' \
            '' \
            '```powershell' \
            "Invoke-WebRequest -Uri $base/orch-server-windows-x64.zip -OutFile orch.zip" \
            'Expand-Archive .\orch.zip -DestinationPath .' \
            'cd orch-server-*-windows-x64' \
            '.\orch-server.exe' \
            '```' \
            '' \
            'The sandbox server is Linux-only, so on Windows it runs under WSL — `uvx opensandbox-server` in there. Drive-letter paths are translated for it (`C:\orch\skills` is `/mnt/c/orch/skills` on its side), and that translated form is what goes in its `allowed_host_paths`; the panel prints the exact line.' \
            '' \
            '---' \
            '' \
            'It prints its own address on the way up — loopback, no login in front of it. `ORCH_HOST` and `ORCH_PORT` move it. Docker is needed for the sandboxes; nothing else is.' \
            '' \
            "The agent image (\`${{ env.REGISTRY }}/orch-agent:$RELEASE_VERSION\`) is pulled by the sandbox server the first time it builds a container. Nothing to pull by hand." \
            > /tmp/notes.md
          gh release create "${{ env.VERSION }}" \
            --title "${{ env.VERSION }}" \
            --generate-notes \
            --notes-file /tmp/notes.md \
            dist/*.tar.gz dist/*.zip

      # A branch release keeps its exact tag, then replays the combined bump and
      # cleanup commit onto main without making publication depend on that race.
      - name: carry the bump onto main
        if: github.ref_name != 'main'
        continue-on-error: true
        run: |
          git fetch origin main
          git checkout -q -B main origin/main
          if git cherry-pick "${{ env.BUMP }}"; then
            git push origin main
          else
            git cherry-pick --abort || true
            echo "::warning::main already carries a different ${VERSION#v}; left alone"
          fi

      # A failed pre-publication tag is recoverable; a published release is not.
      - name: take the tag back
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          v="${{ env.VERSION }}"
          [ -n "$v" ] || exit 0
          if gh release view "$v" >/dev/null 2>&1; then
            echo "::warning::$v is published; keeping the tag"
          else
            echo "::warning::$v failed before publishing; taking the tag back so it can be re-cut"
            git push --delete origin "$v" || true
          fi
