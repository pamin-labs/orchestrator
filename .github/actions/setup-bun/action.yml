name: Setup Bun dependencies
description: Install the pinned Bun runtime and frozen project dependencies.

inputs:
  bun-version:
    description: Exact Bun version to install.
    required: true
  # Three jobs start it — `ci`'s test job and both nightly jobs that reach a
  # database — and each carried the same six-line comment saying why. The
  # comment is the part that drifts, so it lives here once: `openMemory()` is
  # how every test reaches a database, a `services:` block takes no `command`
  # and so ran on PostgreSQL's default connection limit while the compose file
  # raises it, and without it `sandbox-live` and `test-stress` died on
  # `ERR_POSTGRES_CONNECTION_CLOSED` before touching what they exist to test.
  postgres:
    description: Start the suite's PostgreSQL, from the compose file that configures it.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}
    # `setup-bun` caches the Bun binary, not the packages it then downloads, and
    # this action runs four times per pull request — `ci` twice, `security`
    # twice — each one resolving the same frozen lockfile from the network.
    # The key is the lockfile, so a run that changes no dependency restores
    # rather than downloads; `restore-keys` still gives a partial tree to a pull
    # request that does change one, so only the delta is fetched.
    #
    # Keyed on the Bun version as well because the cache holds what that version
    # of the resolver wrote, and on the architecture because `ubuntu-24.04-arm`
    # runs this too and its packages are not the amd64 ones.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-
    - shell: bash
      run: bun install --frozen-lockfile
    - if: inputs.postgres == 'true'
      shell: bash
      run: bun run db:test:up
