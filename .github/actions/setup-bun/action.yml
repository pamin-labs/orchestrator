name: Setup Bun dependencies
description: Install the pinned Bun runtime and frozen project dependencies.

inputs:
  bun-version:
    description: Exact Bun version to install.
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - shell: bash
      run: bun install --frozen-lockfile
