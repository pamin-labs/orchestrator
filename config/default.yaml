# What a startup needs, and nothing else.
#
# Everything that used to be here — how many groups run at once, which model each
# difficulty gets, how long a turn may take, the whole sandbox block — is in the
# panel now, under Settings. Two reasons it moved, and the second is the one that
# settled it:
#
#   1. Those are decisions made while watching the thing run, and a restart to
#      change a concurrency limit costs more than the change.
#   2. This file ships *inside* the release. `orch-server` is one compiled binary
#      per platform and `ROOT` is the directory it was unpacked into, so editing
#      this to raise a budget means editing the download. The same release added
#      ORCH_SKILLS_DIR rather than a yaml key for exactly that reason.
#
# What is left is the three things that have to be known before there is a
# database to read settings out of. Each also takes an environment variable,
# which is what a container deployment sets:
#
#   ORCH_HOST   ORCH_PORT   ORCH_DATA_DIR
#
# Three more exist and are deliberately not keys here. ORCH_SANDBOX_API_KEY and
# ORCH_DATABASE_URL are secrets and this file is committed; ORCH_DATABASE_URL is
# also the one value that could not live in the database whatever we decided,
# since it is how the database is reached. ORCH_SKILLS_DIR is a property of where
# this installation was unpacked.
#
#   ORCH_DATABASE_URL=postgres://user:password@host:5432/orchestrator
#
# Bring your own PostgreSQL — managed, on another machine, or the one container
# in docker/postgres-compose.yml that `bun run db:up` starts. Nothing in the
# product knows which it got, and the schema is applied at boot either way.
#
# Leave it unset and the server starts that container itself, from the copy of
# docker/postgres-compose.yml beside this file: data under dataDir/postgres, a
# password generated once into dataDir/postgres.password and read back on every
# boot after. Docker draws the published port and the server asks which one it
# drew; ORCH_POSTGRES_PORT pins it instead. ADR 051 says why the fallback exists
# — briefly, that docker is already required, so this file's own instruction was
# the only missing piece of a download that otherwise could not start.
#
# Both secrets are read from a `.env` beside the binary too, which is the file to
# put them in. It is not this one, and the reason is one line above: this file is
# committed. A key here would be a password in the next commit, and in every
# release archive built from it.
#
# Anything you do add here still works — it is the default under whatever the
# panel has set — but `test/config.test.ts` will fail if it disagrees with
# `src/config.ts`, because two files quietly answering the same question
# differently is what this file was doing before.

# Where the panel and the agent mailbox listen. **Loopback only**, and the schema
# says so rather than this comment: 127.0.0.1, localhost or ::1, and anything else
# fails at startup.
#
# There is no login on this service — whoever can reach it is the boss — so
# binding 0.0.0.0 hands it to everyone on the network segment. This used to say
# "change it to 0.0.0.0 when running in a container", which the schema has never
# accepted, so anyone following it got a startup failure instead. Publish a port
# instead: `docker -p 127.0.0.1:47821:47821` binds the host side to loopback, and
# inside the container this process still listens on loopback only.
host: 127.0.0.1
port: 47821

# The database, the turn logs, the gate logs and the attachments all live here. A
# relative path is resolved to an absolute one at load: the things that read it
# run from somewhere else, and a relative path resolves differently every time.
dataDir: data
