# What a startup needs, and nothing else.
#
# Everything that used to be here — how many groups run at once, which model each
# difficulty gets, how long a turn may take, the whole sandbox block — is in the
# panel now, under 设置. Two reasons it moved, and the second is the one that
# settled it:
#
#   1. Those are decisions made while watching the thing run, and a restart to
#      change a concurrency limit costs more than the change.
#   2. This file ships *inside* the release. `orch-server` is one compiled binary
#      per platform and `ROOT` is the directory it was unpacked into, so editing
#      this to raise a budget means editing the download. The same release added
#      ORCH_SKILLS_DIR rather than a yaml key for exactly that reason.
#
# What is left is the three things that have to be known before there is a
# database to read settings out of. Each also takes an environment variable,
# which is what a container deployment sets:
#
#   ORCH_HOST   ORCH_PORT   ORCH_DATA_DIR
#
# Two more exist and are deliberately not keys here: ORCH_SANDBOX_API_KEY (a
# secret, and this file is committed) and ORCH_SKILLS_DIR (a property of where
# this installation was unpacked).
#
# Anything you do add here still works — it is the default under whatever the
# panel has set — but `test/config.test.ts` will fail if it disagrees with
# `src/config.ts`, because two files quietly answering the same question
# differently is what this file was doing before.

# 面板和 agent 信箱监听在哪。默认只听本机 —— 这个服务没有登录，
# 谁连得上谁就是老板，所以绑 0.0.0.0 等于把它交给同网段的所有人。
# 装在容器里必须改成 0.0.0.0（否则映射出去的端口连不上），
# 那时候请确保它前面有别的东西挡着：反向代理 + 鉴权，或者只在 Tailscale 里可达。
host: 127.0.0.1
port: 47821

# 数据库、turn 日志、闸门日志、附件都在这儿。相对路径会被解析成绝对路径 ——
# 读它的那些东西跑在别的地方，相对路径解析出来的结果没有两次是一样的。
dataDir: data
