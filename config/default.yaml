# Defaults. See PLAN.md §11.
language: 中文            # human-facing text; code/commits/PRs stay English
# 10 requirements may run at once. The ceiling that bites first is not this number:
# it is file ownership (two groups may not own overlapping paths, so a project with
# few separable modules will not reach 10 no matter what this says) and the account's
# own rate limit. Raise it and watch 成本 → cache 命中: many concurrent turns on one
# subscription is where throttling shows up first.
maxGroups: 10
# Runner pools, one per resource tag. `default` covers every resource with no tag.
# A plain number here still works and means "one pool that size".
#
# Deliberately not 10. A lease is a real build or test on the host, and ten of those
# at once thrash the machine and make every one of them slower — and a wedged lease
# holds its slot for leaseTimeoutMs. Raise only after measuring.
#
# browser: 1 because each browser lease is a real Chromium. This is exactly why the
# pool is split: one global number would have to be the browser's, and every gate in
# the fleet would queue behind one screenshot.
leaseSlots:
  default: 2
  browser: 1
port: 47821              # localhost TCP; agents get ORCH_URL + ORCH_TOKEN

# runtime -> difficulty -> model. The Dispatcher tags each slice; this is the cost knob.
# 每个 role 用哪个 CLI 写在 roles/*.yaml 的 runtime，这里只管「那个 CLI 上，这个难度用哪个模型」。
difficultyModel:
  claude:
    trivial: claude-haiku-4-5-20251001
    normal: claude-sonnet-5
    hard: claude-opus-5
  codex:
    trivial: gpt-5.6-luna
    normal: gpt-5.6-terra
    hard: gpt-5.6-sol

# 每个新切片的 token 上限。在此之前 budget_tokens 从来没被 INSERT 过，恒 NULL，
# scheduler 里那两道熔断一次都没拦过东西。数字取自本仓库 16 个真实切片：
# trivial 均值 4.0M（有一个 12.0M 跑飞的），normal 均值 7.3M 尾部 16.1M，hard 4.0M。
# 卡在「跑完的最坏一片」之上、「跑飞那一片」之下。
sliceBudgetTokens:
  trivial: 8000000
  normal: 20000000
  hard: 30000000

# 谁来答 `orch ctx query` 并写索引摘要。全系统调用最频繁的一个模型调用，纯摘要、
# 不做决策、不用工具、不碰黑板 —— 第一个该从贵的订阅上挪走的就是它。
indexModel:
  runtime: codex
  model: gpt-5.6-luna

# 每个模型的上下文窗口。轮换 session 的分母 —— 之前是写死的 200000，而那只对最便宜那个成立：
# 真实 turn 日志里 haiku-4-5 报 200k，sonnet-5 和 opus-5 报 1M，codex 的 token_count 里
# gpt-5.6 报 272k。也就是强模型一直在 1M 窗口的 12% 处轮换，每轮换一次就扔掉一次缓存前缀。
# 两个 CLI 在 turn 里都会报真实值，那个值优先；这张表管的是一个 session 的第一个 turn。
contextWindow:
  default: 200000
  claude-haiku-4-5-20251001: 200000
  claude-sonnet-5: 1000000
  claude-opus-5: 1000000
  gpt-5.6-sol: 272000
  gpt-5.6-terra: 272000
  gpt-5.6-luna: 272000

# 20 min. Measured on a toy fixture repo the longest single turn was 8.2 min, so
# 10 min left under 2x headroom before the watchdog killed productive work.
turnTimeoutMs: 1200000
# 45. Measured over 259 real turns: median 36 rounds, p90 93, max 144 — and the
# 23% of turns above 60 rounds ate 59% of the entire cache-read bill, because every
# round re-reads the whole transcript. 36 is the work; the tail is an agent that
# has lost the plot and is grepping. Cutting the tail leaves the median alone.
maxTurnsPerJob: 45
sessionRotateFraction: 0.6  # fallback; the real trigger is slice completion
ctxBudgetChars: 16000     # ~4k tokens
parkAfterPausedMs: 7200000
watchdogIntervalMs: 30000   # how often the deterministic rules run
gateRetries: 2

# 3h for one leased command. A big project's compile is hours; without a limit at
# all a hung build holds the lease slot forever, and lease slots are global and
# few, so one wedged command stops every group from gating again.
leaseTimeoutMs: 10800000

# 每个组一个沙盒。agent 碰不到宿主机，宿主机只通过 orch 暴露有限动作。
# 实测在 docs/decisions/005，几条和 OpenSandbox 官方文档相反的结论也在那儿。
sandbox:
  server: 127.0.0.1:8080     # opensandbox-server，必须 dns+nft 模式，否则凭据注入静默失效
                             # egress sidecar 必须 >= v1.1.6：v1.1.4（官方示例配置钉的那个）
                             # 一旦绑了凭据就 403 掉所有 scoped 包，症状是「这个项目装不上依赖」
  apiKey: ""                 # 空 = server 没开鉴权。真要用密钥就走 ORCH_SANDBOX_API_KEY
                             # 环境变量 —— 这个文件是提交进仓库的，密钥写这儿就是泄漏
  image: orch/agent:1        # docker build -f docker/agent.Dockerfile -t orch/agent:1 .
                             # bun + node + git + 两个 CLI，1.5GB（官方 code-interpreter 是 7GB）
  # 留空 = 宿主核数的 1/4。SDK 默认是 "1"，这个仓库的 tsc --noEmit 因此 7.6s（6 核 3.2s）。
  cpu: ""
  memory: 8Gi
  # 沙盒活多久。turn 开始时续期，所以这是「没人管了多久回收」，不是任务上限。
  ttlSeconds: 86400
  # 黑名单，不是白名单 —— 白名单才是穷举不完的那个（每个 registry、每个文档站）。
  # 凭据安全不靠它：真 token 在 sidecar 里，沙盒里是假值。
  denyDomains: []

# Where group worktrees live. Outside $HOME on purpose: the sandbox is deny-only,
# so denying $HOME is how writes get confined (docs/decisions/001).
#
# /var/tmp, not /tmp. Both are outside $HOME, but macOS empties /tmp at boot and
# sweeps anything untouched for three days — and a worktree holds work that is
# committed to a branch nobody has pushed yet. A group that runs overnight, waits
# on the boss over a weekend, or simply outlives a reboot would come back to a
# branch with no checkout. /var/tmp is the standard persistent one and survives
# both. Existing groups keep the path recorded in grp.worktree; this is the
# default for the next one.
workRoot: /var/tmp/orch/worktrees

# 批准之后就别叫我：查收不再挡住下一片开工。默认开 —— 「批了」就该买到一夜的活，
# 关掉的话一个组做完一片就停到早上，等于放弃了这套系统存在的理由。
# 代价说清楚：某一片方向错了，后面几片是在它基础上做的。你退回那一片时全组会停下并说明，
# 而不是悄悄在已完成的工作底下改地基。
autoAdvance: true

# 四道闸（自评 / 对账 / 跑测试 / QA）全过之后自动查收的难度档。
# 默认只有 trivial：前四层照跑，省掉的是第五层「你亲自看一眼」，而 trivial 正是那一眼
# 最不值钱的档。normal / hard 仍然等你。
autoAcceptTiers: ["trivial", "normal"]
