# Defaults. See PLAN.md §11.
language: 中文            # human-facing text; code/commits/PRs stay English
maxGroups: 3
leaseSlots: 1
port: 47821              # localhost TCP; agents get ORCH_URL + ORCH_TOKEN

# difficulty -> model. The Dispatcher tags each slice; this is the cost knob.
difficultyModel:
  trivial: claude-haiku-4-5-20251001
  normal: claude-sonnet-5
  hard: claude-opus-5

turnTimeoutMs: 600000     # 10 min wall clock per turn
maxTurnsPerJob: 30
sessionRotateFraction: 0.6  # fallback; the real trigger is slice completion
ctxBudgetChars: 16000     # ~4k tokens
parkAfterPausedMs: 7200000
watchdogIntervalMs: 30000   # how often the deterministic rules run
gateRetries: 2

# Where group worktrees live. Outside $HOME on purpose: the sandbox is deny-only,
# so denying $HOME is how writes get confined (docs/decisions/001).
workRoot: /tmp/orch/worktrees

# 批准之后就别叫我：查收不再挡住下一片开工。
# 代价：某一片方向错了，后面几片是在它基础上做的。退回时全组会停下并说明。
autoAdvance: false

# 三道闸（自查 / 跑测试 / QA）全过之后自动查收的难度档。
# 加 "trivial" 就是「简单片不用等我看」；normal / hard 仍然等你。
# 这一条把「白干的单位是一片」在 trivial 上放弃了，换整夜无人跑完。
autoAcceptTiers: []
