<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orchestrator</title>
<style>
  /*
   * One file, no build step, nothing fetched.
   *
   * Scene that decides the look: afternoon at the desk, editor open beside this,
   * a fifteen-second glance every twenty minutes to see if anything waits on the
   * boss. So: warm paper, dense, no ceremony. Not a dark ops console.
   *
   * Structure follows PLAN.md §8: slice lanes with gate progress are the main
   * view, chat is a collapsible sidebar, and the other named views (看板 / 工位墙 /
   * 所有权 / 成本) are peers of it rather than boxes crowding one screen.
   *
   * Colour is restrained with one job per hue:
   *   accent (indigo) = needs you        ok (green) = gate passed
   *   bad (red)       = gate failed      dim        = not run yet
   *   motion (pulse)  = running now
   * Accent is cool and far from red/amber/green so "needs you" can never be
   * misread as a gate outcome.
   */
  :root {
    --paper: oklch(0.985 0.005 76);
    --rail: oklch(0.964 0.007 74);
    --sunk: oklch(0.945 0.008 74);
    --rule: oklch(0.902 0.010 72);
    --rule-soft: oklch(0.941 0.008 72);
    --ink: oklch(0.245 0.013 62);
    --ink-2: oklch(0.468 0.011 65);
    --ink-3: oklch(0.625 0.010 68);
    --accent: oklch(0.435 0.145 285);
    --accent-soft: oklch(0.945 0.030 285);
    --on-accent: oklch(0.985 0.006 285);
    --ok: oklch(0.505 0.105 156);
    --bad: oklch(0.512 0.170 27);
    --warn: oklch(0.560 0.115 74);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --out: cubic-bezier(0.22, 1, 0.36, 1);
    --t: 180ms var(--out);
  }
  /* Same design in dark ink, not a second design: the tool stays open into the
     evening and a light-only page in a dark room is hostile. */
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: oklch(0.185 0.008 70);
      --rail: oklch(0.222 0.009 70);
      --sunk: oklch(0.246 0.010 70);
      --rule: oklch(0.312 0.011 70);
      --rule-soft: oklch(0.262 0.010 70);
      --ink: oklch(0.925 0.010 76);
      --ink-2: oklch(0.735 0.010 74);
      --ink-3: oklch(0.585 0.010 72);
      --accent: oklch(0.735 0.125 288);
      --accent-soft: oklch(0.285 0.048 288);
      --on-accent: oklch(0.175 0.012 288);
      --ok: oklch(0.735 0.115 158);
      --bad: oklch(0.680 0.150 28);
      --warn: oklch(0.760 0.105 78);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 0.875rem/1.55 var(--ui); font-variant-numeric: tabular-nums;
  }
  .mono { font-family: var(--mono); }
  .dim { color: var(--ink-3); }
  .dim-2 { color: var(--ink-2); }
  .grow { flex: 1 1 auto; min-width: 0; }
  .row { display: flex; gap: 0.5rem; align-items: center; }
  .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-xs { font-size: 0.6875rem; }
  .t-sm { font-size: 0.75rem; }

  /* ---- chrome ------------------------------------------------------------ */
  header {
    position: sticky; top: 0; z-index: 10; background: var(--rail);
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; gap: 1rem; padding: 0.5rem 1.25rem;
  }
  header b { font-size: 0.9375rem; font-weight: 650; }
  /* Projects are a switch, not a dropdown to hunt through: several projects at
     once is a first-class case, so the current one is visible without a click. */
  .projects { display: flex; gap: 0.25rem; }
  .projects button.on { background: var(--paper); color: var(--ink); border-color: var(--rule); }
  .conn { display: inline-flex; align-items: center; gap: 0.375rem; color: var(--ink-3); }
  .conn i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); transition: background var(--t); }
  .conn.on i { background: var(--ok); animation: breathe 2.4s var(--out) infinite; }
  .conn.off i { background: var(--warn); }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* The views PLAN.md names, one at a time. Crowding them onto one screen is how
     the previous version became seven boxes each reporting an absence. */
  nav {
    display: flex; gap: 1.125rem; padding: 0 1.25rem;
    border-bottom: 1px solid var(--rule); background: var(--rail);
    position: sticky; top: 2.5rem; z-index: 9;
  }
  nav a {
    font-size: 0.8125rem; color: var(--ink-3); text-decoration: none; cursor: pointer;
    padding: 0.5rem 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color var(--t), border-color var(--t);
  }
  nav a:hover { color: var(--ink); }
  nav a.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 550; }
  nav a .n { font-family: var(--mono); font-size: 0.6875rem; color: var(--accent); margin-left: 0.25rem; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 0; }
  main.side { grid-template-columns: minmax(0, 1fr) 20rem; }
  @media (max-width: 64rem) { main.side { grid-template-columns: 1fr; } }
  .view { padding: 1.125rem 1.25rem 5rem; max-width: 76rem; }
  aside { border-left: 1px solid var(--rule); overflow: hidden; }
  aside > div { padding: 1rem 1rem 5rem; }

  /* ---- controls ---------------------------------------------------------- */
  button {
    font: inherit; font-size: 0.8125rem; line-height: 1.2; white-space: nowrap;
    padding: 0.3125rem 0.625rem; border-radius: 0.375rem; cursor: pointer;
    border: 1px solid var(--rule); background: var(--paper); color: var(--ink-2);
    transition: color var(--t), border-color var(--t), background var(--t);
  }
  button:hover { color: var(--ink); border-color: var(--ink-3); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:active { background: var(--sunk); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 550; }
  button.go:hover { filter: brightness(1.08); color: var(--on-accent); border-color: var(--accent); }
  button.quiet { border-color: transparent; background: none; color: var(--ink-3); }
  button.quiet:hover { color: var(--ink); background: var(--sunk); }
  input, textarea, select {
    font: inherit; font-size: 0.8125rem; width: 100%; color: var(--ink);
    padding: 0.3125rem 0.5rem; border: 1px solid var(--rule); border-radius: 0.375rem;
    background: var(--paper); transition: border-color var(--t), box-shadow var(--t);
  }
  input::placeholder, textarea::placeholder { color: var(--ink-3); }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { font-family: var(--mono); font-size: 0.75rem; line-height: 1.6; resize: vertical; }

  /* ---- group band -------------------------------------------------------- */
  .band { padding: 1rem 0; border-top: 1px solid var(--rule); }
  .band:first-of-type { border-top: none; padding-top: 0; }
  .band-head { display: flex; align-items: baseline; gap: 0.625rem; flex-wrap: wrap; }
  .gname { font-size: 0.9375rem; font-weight: 620; cursor: pointer; }
  .gname:hover { color: var(--accent); }
  .pill {
    font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.06em;
    padding: 0.125rem 0.375rem; border-radius: 0.1875rem; background: var(--sunk); color: var(--ink-2);
  }
  .pill.needs { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .pill.live { color: var(--ok); }
  .meta { font-family: var(--mono); font-size: 0.6875rem; color: var(--ink-3); }
  .acts { display: flex; gap: 0.375rem; margin-left: auto; }
  .budget { display: inline-block; width: 3.5rem; height: 0.25rem; border-radius: 0.125rem;
            background: var(--rule); vertical-align: middle; }
  .budget > i { display: block; height: 100%; border-radius: 0.125rem; background: var(--ink-3); }
  .budget > i.hot { background: var(--warn); }

  /* ---- slice lanes ------------------------------------------------------- */
  /* Progress is which gates passed, never a percentage: a model's percentage is a
     guess, a gate is a fact. Fixed columns so tracks line up down the page, which
     is what makes "卡在哪道闸" answerable at a glance. */
  .lane {
    display: grid; grid-template-columns: 1.75rem minmax(0, 1fr) 13rem 8.5rem;
    align-items: start; gap: 0.375rem 0.75rem;
    padding: 0.5rem 0; border-top: 1px solid var(--rule-soft);
  }
  .lane:first-of-type { border-top: none; }
  .lane.needs { background: var(--accent-soft); border-radius: 0.375rem;
                margin: 0.25rem -0.5rem; padding: 0.5rem; border-top-color: transparent; }
  @media (max-width: 78rem) {
    .lane { grid-template-columns: 1.75rem minmax(0, 1fr) auto; }
    .lane .acts-col { grid-column: 2 / -1; justify-content: flex-start; }
  }
  .seq { font-family: var(--mono); font-size: 0.75rem; color: var(--ink-3); padding-top: 0.125rem; }
  .lane .title { font-size: 0.8125rem; }
  .lane .spec { font-family: var(--mono); font-size: 0.6875rem; color: var(--ink-3); margin-top: 0.125rem; }
  .tier { font-family: var(--mono); font-size: 0.625rem; color: var(--ink-3); }
  .acts-col { display: flex; gap: 0.375rem; justify-content: flex-end; align-items: center; }
  /* The orchestrator narrates for free: which files changed, what command ran. No
     agent is asked to report progress, so this line costs nothing. */
  .doing { font-size: 0.6875rem; color: var(--ink-2); font-family: var(--mono); margin-top: 0.1875rem; }
  .waitfor { font-size: 0.6875rem; color: var(--ink-3); margin-top: 0.1875rem; }
  .tasks { margin: 0.3125rem 0 0; padding: 0; list-style: none; }
  .tasks li { display: flex; gap: 0.5rem; font-size: 0.75rem; color: var(--ink-2); padding: 0.0625rem 0; }
  .tasks li .tick { font-family: var(--mono); color: var(--ink-3); }
  .tasks li.done .tick { color: var(--ok); }
  .tasks li.done span { color: var(--ink-3); }

  .track { display: flex; align-items: center; }
  .stop { display: flex; align-items: center; gap: 0.25rem; font-size: 0.6875rem; color: var(--ink-3); }
  .stop b { font-weight: 500; white-space: nowrap; }
  .stop::after { content: ""; width: 0.875rem; height: 1px; background: var(--rule); margin: 0 0.3125rem; }
  .stop:last-child::after { display: none; }
  .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; border: 1px solid var(--ink-3); }
  .stop.pass { color: var(--ok); } .stop.pass .dot { background: var(--ok); border-color: var(--ok); }
  .stop.fail { color: var(--bad); } .stop.fail .dot { background: var(--bad); border-color: var(--bad); }
  .stop.now { color: var(--ink); }
  .stop.now .dot { border-color: var(--ink); animation: breathe 1.6s var(--out) infinite; }
  .stop.wait { color: var(--accent); font-weight: 600; }
  .stop.wait .dot { background: var(--accent); border-color: var(--accent); }

  /* ---- questions --------------------------------------------------------- */
  /* PLAN.md §8 puts the open question directly under the lanes it blocks, not in
     a separate inbox: the answer depends on what those slices say. */
  .ask { padding: 0.625rem 0; border-top: 1px solid var(--rule-soft); }
  .ask .who { font-family: var(--mono); font-size: 0.6875rem; color: var(--ink-3); }
  .ask.blocker .who { color: var(--bad); }
  .ask .q { font-size: 0.8125rem; margin: 0.1875rem 0 0.5rem; }

  /* ---- draft card -------------------------------------------------------- */
  .said { font-size: 0.8125rem; color: var(--ink-2); margin: 0.5rem 0 0.75rem;
          padding-left: 0.625rem; border-left: 1px solid var(--rule); }
  .objection { font-size: 0.75rem; background: var(--sunk); border-radius: 0.375rem;
               padding: 0.5rem 0.625rem; margin: 0.5rem 0; white-space: pre-wrap; }
  .objection em { font-style: normal; font-weight: 600; color: var(--warn); }

  /* ---- tables ------------------------------------------------------------ */
  h2 { font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em;
       color: var(--ink-3); margin: 0 0 0.625rem; }
  h3 { font-size: 0.8125rem; font-weight: 600; margin: 1.375rem 0 0.5rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
  th { text-align: left; font-weight: 500; font-size: 0.6875rem; text-transform: uppercase;
       letter-spacing: 0.07em; color: var(--ink-3); padding: 0 0.75rem 0.375rem 0;
       border-bottom: 1px solid var(--rule); }
  td { padding: 0.375rem 0.75rem 0.375rem 0; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
  td.num { text-align: right; font-family: var(--mono); font-size: 0.75rem; padding-right: 0; }
  tr:last-child td { border-bottom: none; }
  .bar { display: block; height: 0.25rem; border-radius: 0.125rem; background: var(--rule); min-width: 3rem; }
  .bar > i { display: block; height: 100%; border-radius: 0.125rem; background: var(--ink-3); }
  .clash { color: var(--bad); }

  /* ---- projects ---------------------------------------------------------- */
  /* A project's state is an aggregate of its requirements, ordered by what should
     pull the eye: does it want me, is it moving, is it stuck, is it empty. */
  .plist { display: grid; gap: 0; margin-bottom: 1.75rem; }
  .prow { display: grid; grid-template-columns: minmax(0, 1fr) 8.5rem 5rem 4.5rem;
          gap: 0.75rem; align-items: baseline; padding: 0.5rem 0.5rem;
          border-top: 1px solid var(--rule-soft); cursor: pointer; border-radius: 0.375rem; }
  .prow:hover { background: var(--sunk); }
  .prow.on { background: var(--sunk); }
  .prow .pn { font-size: 0.875rem; font-weight: 600; }
  .prow .pp { font-family: var(--mono); font-size: 0.6875rem; color: var(--ink-3); }
  .prow .ps { font-size: 0.75rem; color: var(--ink-3); }
  .prow .ps.mine { color: var(--accent); font-weight: 600; }
  .prow .ps.live { color: var(--ok); }

  /* ---- decision queue --------------------------------------------------- */
  /* The boss's whole job is this list, and it can reach zero. A board cannot: it
     always looks half empty, which trains you to ignore it. */
  .queue { border: 1px solid var(--accent); border-radius: 0.5rem; overflow: hidden; margin-bottom: 1.75rem; }
  .queue.clear { border-color: var(--rule); }
  .qhead { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem;
           background: var(--accent-soft); font-size: 0.75rem; color: var(--accent); font-weight: 600; }
  .queue.clear .qhead { background: var(--sunk); color: var(--ink-3); font-weight: 500; }
  .qrow { display: grid; grid-template-columns: 2.75rem minmax(0, 1fr) auto;
          gap: 0.75rem; align-items: center; padding: 0.625rem 0.75rem;
          border-top: 1px solid var(--rule-soft); }
  .qrow:hover { background: var(--sunk); }
  .qrow.on { background: var(--accent-soft); }
  .qrow .kind { font-size: 0.6875rem; color: var(--accent); font-family: var(--mono); }
  .qrow .what { font-size: 0.8125rem; font-weight: 550; cursor: pointer; }
  .qrow .sub { font-size: 0.75rem; color: var(--ink-3); margin-top: 0.0625rem; }
  .qrow .qacts { display: flex; gap: 0.375rem; }
  .qclear { padding: 1.125rem 0.75rem; font-size: 0.8125rem; color: var(--ink-2); }
  .qclear b { color: var(--ok); }

  /* ---- pipeline ---------------------------------------------------------- */
  /* One track per requirement: slices in order, gates as ticks inside each slice.
     Columns cannot show sequence, and sequence is what "走到哪" means here. */
  .pipe { display: grid; grid-template-columns: 9rem minmax(0, 1fr) auto;
          gap: 0.75rem; align-items: center; padding: 0.6875rem 0;
          border-top: 1px solid var(--rule-soft); cursor: pointer; }
  .pipe:hover { background: var(--sunk); }
  .pipe .pname { font-size: 0.8125rem; font-weight: 550; overflow-wrap: anywhere; }
  .pipe .pstate { font-size: 0.6875rem; color: var(--ink-3); font-family: var(--mono); }
  .track2 { display: flex; gap: 0.375rem; align-items: stretch; flex-wrap: wrap; }
  /* A segment per slice. Its ticks are the gates, so length means work and fill
     means verified: nothing here is a guessed percentage. */
  .seg { flex: 1 1 6rem; min-width: 4.5rem; border: 1px solid var(--rule); border-radius: 0.3125rem;
         padding: 0.25rem 0.375rem; background: var(--paper); }
  .seg.now { border-color: var(--ink-3); }
  .seg.mine { border-color: var(--accent); background: var(--accent-soft); }
  .seg.done { background: var(--sunk); border-color: var(--rule-soft); }
  .seg.bad { border-color: var(--bad); }
  .seg .sl { font-size: 0.625rem; font-family: var(--mono); color: var(--ink-3);
             display: flex; gap: 0.25rem; align-items: center; }
  .seg.mine .sl { color: var(--accent); font-weight: 600; }
  .seg .st { font-size: 0.6875rem; color: var(--ink-2); margin-top: 0.0625rem;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ticks { display: flex; gap: 0.25rem; margin-top: 0.3125rem; }
  .ticks i { height: 0.1875rem; width: 1rem; border-radius: 0.09375rem; background: var(--rule); }
  .ticks i.p { background: var(--ok); }
  .ticks i.f { background: var(--bad); }
  .ticks i.n { background: var(--ink-3); animation: breathe 1.6s var(--out) infinite; }
  .plan { font-size: 0.75rem; color: var(--ink-3); }

  .item { padding: 0.75rem 0; border-bottom: 1px solid var(--rule-soft); }
  .item .head { display: flex; gap: 0.5rem; align-items: baseline; }
  /* Adding a requirement is a button, not a form that is always open. */
  .newbar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
  .setup { border: 1px solid var(--rule); border-radius: 0.5rem; padding: 0.875rem 1rem; max-width: 40rem; }
  /* A modal earns its place here: picking a folder is a focused, transient task
     with its own navigation, and inlining a file browser would bury the page. */
  dialog {
    border: 1px solid var(--rule); border-radius: 0.625rem; background: var(--paper); color: var(--ink);
    padding: 0; width: min(34rem, 92vw); box-shadow: 0 12px 40px oklch(0 0 0 / 0.18);
  }
  dialog::backdrop { background: oklch(0.2 0.01 70 / 0.35); }
  .dtitle { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.75rem 0.875rem;
            border-bottom: 1px solid var(--rule); }
  .dtitle b { font-size: 0.875rem; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 0.25rem; align-items: center;
            padding: 0.5rem 0.875rem; border-bottom: 1px solid var(--rule-soft);
            font-family: var(--mono); font-size: 0.6875rem; }
  .crumbs button { padding: 0.0625rem 0.25rem; font-size: 0.6875rem; }
  .dlist { max-height: 46vh; overflow-y: auto; }
  .drow { display: grid; grid-template-columns: 1.125rem minmax(0, 1fr) auto; gap: 0.5rem;
          align-items: center; padding: 0.375rem 0.875rem; cursor: pointer; font-size: 0.8125rem; }
  .drow:hover { background: var(--sunk); }
  .drow .ic { font-family: var(--mono); color: var(--ink-3); font-size: 0.75rem; }
  .drow.isrepo .ic { color: var(--accent); }
  .drow.isrepo .nm { font-weight: 550; }
  .drow.taken { color: var(--ink-3); }
  .dfoot { display: flex; gap: 0.5rem; align-items: center; padding: 0.75rem 0.875rem;
           border-top: 1px solid var(--rule); }
  .setup b { font-size: 0.875rem; }
  .setup .why { font-size: 0.75rem; color: var(--ink-3); margin: 0.25rem 0 0.75rem; }

  /* ---- feed -------------------------------------------------------------- */
  .feed { font-family: var(--mono); font-size: 0.6875rem; line-height: 1.6;
          max-height: calc(100vh - 12rem); overflow-y: auto; overscroll-behavior: contain; }
  .feed > div { padding: 0.0625rem 0; animation: in 200ms var(--out); }
  .feed .said-by { color: var(--ink-2); }
  .feed .partial { color: var(--ink-3); }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }

  /* ---- first run --------------------------------------------------------- */
  .first { max-width: 34rem; }
  .first h1 { font-size: 1.125rem; font-weight: 620; margin: 0 0 0.375rem; }
  .first p { color: var(--ink-2); margin: 0 0 1.25rem; font-size: 0.8125rem; }
  .step { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr); gap: 0.75rem;
          padding: 0.875rem 0; border-top: 1px solid var(--rule); }
  .step > b { font-family: var(--mono); font-size: 0.75rem; color: var(--ink-3); font-weight: 400; }
  .step h4 { font-size: 0.8125rem; font-weight: 600; margin: 0 0 0.125rem; }
  .step .why { font-size: 0.75rem; color: var(--ink-3); margin: 0 0 0.625rem; }
  .step.off h4, .step.off .why { color: var(--ink-3); }

  .compose { display: flex; gap: 0.5rem; align-items: center; padding-bottom: 1rem; }
  .none { font-size: 0.75rem; color: var(--ink-3); }
</style>
</head>
<body>
<header>
  <b>orchestrator</b>
  <span class="projects" id="projects"></span>
  <span class="grow"></span>
  <span class="t-xs mono dim" id="spend"></span>
  <button class="quiet t-xs" id="sidetoggle" title="事件流">事件流</button>
  <span class="conn t-xs mono" id="conn"><i></i><span>connecting</span></span>
</header>
<nav id="nav"></nav>

<dialog id="pick">
  <div class="dtitle"><b>选择仓库</b><span class="none" id="pickhint">git 仓库排在前面</span></div>
  <div class="crumbs" id="crumbs"></div>
  <div class="dlist" id="dlist"></div>
  <div class="dfoot">
    <input id="pname" placeholder="项目名，默认取目录名" style="max-width:12rem" aria-label="项目名" />
    <span class="grow"></span>
    <button onclick="document.getElementById('pick').close()">取消</button>
    <button class="go" id="pickok">选择此目录</button>
  </div>
</dialog>

<main id="main">
  <div class="view" id="view"></div>
  <aside><div><h2>事件流</h2><div class="feed" id="feed-all"></div></div></aside>
</main>

<!-- type="module" is required: the bottom of this file uses top-level await, which is a
     SyntaxError in a classic script, and a SyntaxError means NONE of the page's JS
     runs, so the UI looks like a static mockup stuck on "connecting". -->
<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" })[c]);
const money = (n) => `$${(n || 0).toFixed(2)}`;
const K = (n) => (n >= 1000 ? `${Math.round(n / 1000)}k` : String(n || 0));
let state = { projects: [], groups: [], slices: [], tasks: [], agents: [], escalations: [] };
let cost = null;

/** Where the boss is. Kept in the hash so a reload and a notification link land here. */
const sel = { p: null, view: "board", g: null, side: true, adding: false };

function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("p")) sel.p = Number(h.get("p"));
  if (h.get("v")) sel.view = h.get("v");
  sel.g = h.get("g") ? Number(h.get("g")) : null;
}
function writeHash() {
  const h = new URLSearchParams();
  if (sel.p) h.set("p", sel.p);
  h.set("v", sel.view);
  if (sel.g) h.set("g", sel.g);
  history.replaceState(null, "", `#${h}`);
}
window.go = (patch) => { Object.assign(sel, patch); writeHash(); render(); };

const api = async (path, body, method = "POST") => {
  const r = await fetch(path, {
    method,
    headers: body ? { "content-type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await r.text();
  if (!r.ok) alert(text);   // validators reply with the reason; show it verbatim
  return { ok: r.ok, text };
};

async function refresh() {
  const [s, c] = await Promise.all([fetch("/api/state"), fetch("/api/cost")]);
  state = await s.json();
  cost = await c.json();
  render();
}

/* ------------------------------------------------------------------ shared */

const STATUS_ZH = {
  PLANNING: "拆解中", DRAFT: "等你批", RUNNING: "在跑", PAUSING: "正在停",
  PAUSED: "已暂停", PARKED: "已封存", PR_OPEN: "PR 开着", DISSOLVED: "已解散",
};
const WHERE_ZH = { pm: "PM 答不了", architect: "Architect 答不了", cos: "CoS 答不了", boss: "轮到你" };
const STOPS = [["self", "自查"], ["gate", "测试"], ["qa", "QA"]];

const owns = (g) => { try { return JSON.parse(g.owns_json || "[]"); } catch { return []; } };
const groupsOf = (p) => state.groups.filter((g) => g.project_id === p);
const slicesOf = (id) => state.slices.filter((s) => s.grp_id === id);
const agentsOf = (id) => state.agents.filter((a) => a.grp_id === id);
const asksOf = (id) => state.escalations.filter((e) => e.grp_id === id);
const since = (ms) => {
  const m = Math.round((Date.now() - ms) / 60000);
  return m < 1 ? "刚刚" : m < 60 ? `${m}m` : `${Math.round(m / 60)}h`;
};

/** The things that block the boss, per PLAN.md. Nothing else counts as waiting. */
function pending(p) {
  const ids = new Set(groupsOf(p).map((g) => g.id));
  return {
    cards: groupsOf(p).filter((g) => g.status === "DRAFT"),
    slices: state.slices.filter((s) => ids.has(s.grp_id) && s.status === "awaiting_boss"),
    merges: (state.mergeQueue ?? []).filter((m) => ids.has(m.grpId)),
    asks: state.escalations.filter((e) => ids.has(e.grp_id) && e.chain_state === "boss"),
  };
}

/* ------------------------------------------------------------------ render */

function render() {
  if (!state.projects.length) {
    $("#projects").innerHTML = "";
    $("#nav").innerHTML = "";
    $("#spend").textContent = "";
    $("#main").className = "";
    $("#view").innerHTML = setupHtml();
    return wire();
  }
  if (!sel.p || !state.projects.some((p) => p.id === sel.p)) sel.p = state.projects[0].id;

  $("#projects").innerHTML = state.projects.map((p) => {
    const n = Object.values(pending(p.id)).reduce((a, x) => a + x.length, 0);
    return `<button class="${p.id === sel.p ? "on" : ""}" onclick="go({p:${p.id},g:null})">${esc(p.name)}${
      n ? `<span class="mono t-xs" style="color:var(--accent)"> ${n}</span>` : ""}</button>`;
  }).join("") + `<button class="quiet" title="添加项目" onclick="openPick()">＋</button>`;

  const w = pending(sel.p);
  const waiting = w.cards.length + w.slices.length + w.merges.length + w.asks.length;
  const VIEWS = [["board", "概览", waiting], ["progress", "进展", 0],
                 ["desk", "工位墙", 0], ["owns", "所有权", 0], ["cost", "成本", 0]];
  $("#nav").innerHTML = VIEWS.map(([k, zh, n]) =>
    `<a class="${sel.view === k ? "on" : ""}" onclick="go({view:'${k}'})">${zh}${
      n ? `<span class="n">${n}</span>` : ""}</a>`).join("");

  const usd = state.groups.reduce((n, g) => n + (g.spent_usd || 0), 0);
  $("#spend").textContent = usd ? money(usd) : "";
  $("#main").className = sel.side ? "side" : "";

  const body = { progress: progressView, board: boardView, desk: deskView, owns: ownsView, cost: costView };
  $("#view").innerHTML = (body[sel.view] ?? progressView)();
  wire();
  paintFeeds();
}

/* ---------------------------------------------------------- 进展 (main view) */

function progressView() {
  const gs = groupsOf(sel.p);
  // A selected group is shown alone: that is the drill-in, and it makes room for
  // its tasks, its people and its questions without a second screen.
  const shown = sel.g ? gs.filter((g) => g.id === sel.g) : gs;
  return `<button class="quiet" style="margin-bottom:.75rem" onclick="go({view:'board',g:null})">← 概览</button>` +
    (gs.length
      ? shown.map((g) => bandHtml(g, !!sel.g)).join("")
      : '<div class="none">该项目暂无需求。概览页「＋ 新需求」添加。</div>');
}


function bandHtml(g, open) {
  const slices = slicesOf(g.id);
  const needs = g.status === "DRAFT";
  const done = slices.filter((s) => s.status === "done").length;
  return `<section class="band">
    <div class="band-head">
      <span class="gname" onclick="go({g:${open ? "null" : g.id}})">${esc(g.name)}</span>
      <span class="pill ${needs ? "needs" : g.status === "RUNNING" ? "live" : ""}">${STATUS_ZH[g.status] ?? esc(g.status)}</span>
      ${slices.length ? `<span class="meta">${done}/${slices.length} 片已查收</span>` : ""}
      ${g.branch ? `<span class="meta">${esc(g.branch)}</span>` : ""}
      ${budgetHtml(g)}
      <span class="acts">${actionsHtml(g)}</span>
    </div>
    ${needs ? draftHtml(g)
      : slices.length ? slices.map((s) => laneHtml(s, g, open)).join("")
      : '<div class="none" style="margin-top:.5rem">还没有切片</div>'}
    ${asksOf(g.id).map(askHtml).join("")}
  </section>`;
}

function budgetHtml(g) {
  const spent = money(g.spent_usd);
  if (!g.budget_tokens) return `<span class="meta">${spent}</span>`;
  // Budgets are set in tokens, so the bar is tokens and the money is money.
  // Inventing a dollar budget would put a number on screen nothing enforces.
  const pct = Math.min(100, (g.spent_tokens / g.budget_tokens) * 100);
  return `<span class="meta" title="${K(g.spent_tokens)} / ${K(g.budget_tokens)} tokens">${spent}
    <span class="budget"><i class="${pct > 80 ? "hot" : ""}" style="width:${pct}%"></i></span></span>`;
}

function actionsHtml(g) {
  const b = [];
  if (g.status === "RUNNING") b.push(`<button onclick="ctl(${g.id},'pause')">暂停</button>`);
  if (["PAUSED", "PAUSING"].includes(g.status)) b.push(`<button onclick="ctl(${g.id},'resume')">继续</button>`);
  if (g.status === "PARKED") b.push(`<button onclick="ctl(${g.id},'wake')">唤醒</button>`);
  if (["RUNNING", "PAUSING"].includes(g.status)) {
    b.push(`<button class="quiet" onclick="interrupt(${g.id},'keep')" title="立刻停手，改到一半的东西留着">打断</button>`);
    b.push(`<button class="quiet" onclick="interrupt(${g.id},'rollback')" title="立刻停手，并且退回到这一轮开始前">打断并回滚</button>`);
  }
  b.push(mergeHtml(g));
  b.push(`<button class="quiet" onclick="ctl(${g.id},'park')">封存</button>`);
  return b.filter(Boolean).join("");
}

/**
 * Only the queue head gets a merge button. Showing three "ready to merge" rows is
 * an invitation to merge them in the wrong order, and the boss is the only person
 * who could then work out which one broke main.
 */
function mergeHtml(g) {
  if ((state.mergeQueue ?? []).some((m) => m.grpId === g.id)) {
    return `<button class="go" onclick="landed(${g.id})">已 merge，收尾</button>`;
  }
  return g.status === "PR_OPEN" ? `<span class="pill">排队等 merge</span>` : "";
}

function laneHtml(s, g, open) {
  let gates = {};
  try { gates = JSON.parse(s.gates_json || "{}"); } catch {}
  const waiting = s.status === "awaiting_boss";
  const track = STOPS.map(([k, zh]) => {
    const v = gates[k];
    const cls = v === "pass" ? "pass" : v === "fail" ? "fail" : s.status === k ? "now" : "";
    return `<span class="stop ${cls}"><span class="dot"></span><b>${zh}</b></span>`;
  }).join("") +
    `<span class="stop ${waiting ? "wait" : ""}"><span class="dot"></span><b>${waiting ? "等你收" : "查收"}</b></span>`;

  // Who is on this slice, narrated by the orchestrator out of the turn's own
  // stream. Agents are never asked to report progress.
  const on = agentsOf(g.id).filter((a) => a.state === "running");
  const tasks = state.tasks.filter((t) => t.slice_id === s.id);
  return `<div class="lane ${waiting ? "needs" : ""}">
    <span class="seq">S${s.seq}</span>
    <div>
      <div class="title">${esc(s.title)} <span class="tier">${esc(s.difficulty)}</span></div>
      <div class="spec">${esc(s.accept_spec)}</div>
      ${s.status === "pending" ? '<div class="waitfor">⏸ 等前一片做完</div>' : ""}
      ${["in_progress", "running", "gate", "qa"].includes(s.status) && on.length
        ? `<div class="doing">${on.map((a) => `${esc(a.role)} ▸ ${esc(a.activity || a.state)}`).join(" · ")}</div>` : ""}
      ${open && tasks.length ? `<ul class="tasks">${tasks.map((t) =>
        `<li class="${t.status === "done" ? "done" : ""}"><span class="tick">${
          t.status === "done" ? "✓" : "○"}</span><span>${esc(t.title)}</span></li>`).join("")}</ul>` : ""}
    </div>
    <span class="track">${track}</span>
    <span class="acts-col">
      ${waiting ? `<button class="go" onclick="slice(${s.id},'accept')">查收</button>
                   <button onclick="sliceReject(${s.id})">不满意</button>` : ""}
    </span>
  </div>`;
}

function askHtml(e) {
  const urgency = e.severity === "blocker" ? "卡住了" : "不急";
  const mine = e.chain_state === "boss";
  return `<div class="ask ${esc(e.severity)}">
    <div class="who">${esc(e.asker || "?")} 问 · ${urgency} · ${
      WHERE_ZH[e.chain_state] ?? esc(e.chain_state)} · 等了 ${since(e.created_at)}</div>
    <div class="q">${esc(e.question)}</div>
    ${mine ? `<div class="row">
      <input id="ans-${e.id}" class="grow" placeholder="你的答复" aria-label="答复" />
      <button class="go" onclick="answer(${e.id})">回答</button>
      <button onclick="delegate(${e.id},'architect')" title="不想自己答，交给 Architect">转 Architect</button>
    </div>` : ""}
  </div>`;
}

function draftHtml(g) {
  // The card the Dispatcher filed, editable in place. An empty box asking for
  // approval would be asking the boss to approve something unseen.
  const filed = (state.draftCards ?? []).find((c) => c.grpId === g.id)?.body ?? "";
  const idea = (state.ideas ?? []).find((i) => i.grpId === g.id)?.body ?? "";
  // An objection that arrived after the card was filed. Without this the card
  // reads 反对 : 无 and the boss approves a plan somebody had already argued with.
  const late = (state.lateObjections ?? []).filter((o) => o.grpId === g.id);
  const rows = Math.max(7, filed.split("\n").length + 1);
  // Your own words next to the plan: the only thing that makes "is this aimed at
  // what I asked for" a 20-second question instead of a re-read.
  return `${idea ? `<div class="said">${esc(idea)}</div>` : ""}
    ${late.map((o) => `<div class="objection"><em>卡交了之后 ${esc(o.author)} 说</em> ${esc(o.body)}</div>`).join("")}
    ${filed ? "" : '<div class="none" style="margin-bottom:.5rem">等它把计划卡交上来</div>'}
    <textarea id="card-${g.id}" rows="${rows}" aria-label="计划卡" placeholder="目标 : …
不做 : …
验收 : …
切片 : 标题 [normal] — 怎么验收
风险 : …
反对 : 无">${esc(filed)}</textarea>
    <div class="row" style="margin-top:.625rem">
      <button class="go" onclick="approve(${g.id})">同意，开工</button>
      <input id="why-${g.id}" class="grow" placeholder="哪儿不对，一句话" aria-label="打回理由" />
      <button onclick="reject(${g.id})">重新拆</button>
    </div>`;
}

/* ---------------------------------------------------------- 概览 (home) */

/**
 * Queue first, pipeline second.
 *
 * The boss never moves anything, so columns model an interaction that does not
 * exist. What does exist: a handful of decisions that arrive over time, and a set
 * of requirements each somewhere along an ordered pipeline. So: a list that can
 * reach zero, and one track per requirement whose segments are its slices.
 */

/**
 * A project's state, in the order the boss should care.
 *
 * Not the group status enum: the boss does not need to know that four groups are
 * PAUSING. They need to know whether this project wants something from them.
 */
function projectState(p) {
  const w = pending(p);
  const n = w.cards.length + w.slices.length + w.merges.length + w.asks.length;
  if (n) return { zh: `${n} 件等你`, cls: "mine" };
  const gs = groupsOf(p);
  if (!gs.length) return { zh: "空着", cls: "" };
  const live = gs.filter((g) => ["RUNNING", "PLANNING", "PAUSING"].includes(g.status)).length;
  if (live) return { zh: `${live} 个在跑`, cls: "live" };
  const held = gs.filter((g) => ["PAUSED", "PARKED"].includes(g.status)).length;
  if (held) return { zh: `${held} 个停着`, cls: "" };
  return { zh: "都做完了", cls: "" };
}

function projectsHtml() {
  return `<h2>项目</h2><div class="plist">${state.projects.map((p) => {
    const st = projectState(p.id);
    const gs = groupsOf(p.id);
    const usd = gs.reduce((n, g) => n + (g.spent_usd || 0), 0);
    return `<div class="prow ${p.id === sel.p ? "on" : ""}" onclick="go({p:${p.id},g:null})">
      <div><div class="pn">${esc(p.name)}</div><div class="pp trunc">${esc(p.repo_path)}</div></div>
      <span class="ps ${st.cls}">${st.zh}</span>
      <span class="ps">${gs.length ? `${gs.length} 个需求` : ""}</span>
      <span class="meta" style="text-align:right">${usd ? money(usd) : ""}</span>
    </div>`;
  }).join("")}</div>`;
}

function boardView() {
  if (!state.projects.length) return setupHtml();
  const gs = groupsOf(sel.p);
  const bar = `<div class="newbar">
      <button class="go" onclick="go({adding:${!sel.adding}})">${sel.adding ? "取消" : "＋ 新需求"}</button>
      <span class="none">${gs.length ? `${gs.length} 个需求` : "无需求"}</span>
    </div>
    ${sel.adding ? `<div class="setup" style="margin-bottom:1.25rem">
      <b>新需求</b>
      <div class="why">一句话即可。产出一张计划卡等你同意，同意前不写代码。</div>
      <div class="row"><input id="idea" class="grow" placeholder="例：登录页加「记住我」" aria-label="想法" />
        <button class="go" id="drop">提交</button></div>
    </div>` : ""}`;
  return projectsHtml() + bar + queueHtml() + pipelineHtml(gs);
}

/** Everything waiting on the boss, in one list, with its action on the row. */
function queueHtml() {
  const w = pending(sel.p);
  const rows = [];
  for (const g of w.cards) {
    const filed = (state.draftCards ?? []).find((c) => c.grpId === g.id)?.body ?? "";
    const goal = (filed.split("\n").find((l) => l.startsWith("目标")) ?? "").replace(/^目标\s*[:：]\s*/, "");
    const objected = (state.lateObjections ?? []).some((o) => o.grpId === g.id);
    rows.push(qrow("计划", esc(g.name), esc(goal || "还在写卡"),
      `<button class="go" onclick="go({view:'progress',g:${g.id}})">看卡</button>`,
      objected ? "有人提了反对" : "", g.id));
  }
  for (const s of w.slices) {
    const g = state.groups.find((x) => x.id === s.grp_id);
    rows.push(qrow("切片", esc(s.title), `${esc(g?.name ?? "")} · ${esc(s.accept_spec)}`,
      `<button class="go" onclick="slice(${s.id},'accept')">查收</button>
       <button onclick="sliceReject(${s.id})">不满意</button>`, "", s.grp_id));
  }
  for (const m of w.merges) {
    rows.push(qrow("PR", esc(m.name), esc(m.branch ?? ""),
      `<button class="go" onclick="landed(${m.grpId})">已 merge</button>`, "", m.grpId));
  }
  for (const e of w.asks) {
    const g = state.groups.find((x) => x.id === e.grp_id);
    rows.push(qrow("提问", esc(e.question), `${esc(e.asker ?? "?")} · ${esc(g?.name ?? "")} · 等了 ${since(e.created_at)}`,
      `<button class="go" onclick="go({view:'progress',g:${e.grp_id}})">去回答</button>`,
      e.severity === "blocker" ? "全组停着" : "", e.grp_id));
  }
  if (!rows.length) {
    return `<div class="queue clear"><div class="qhead">等你</div>
      <div class="qclear"><b>无待办。</b> 需要决策时出现在这里，并发通知。</div></div>`;
  }
  return `<div class="queue"><div class="qhead">等你 ${rows.length}</div>${rows.join("")}</div>`;
}

function qrow(kind, what, sub, acts, flag, gid) {
  return `<div class="qrow">
    <span class="kind">${kind}</span>
    <div>
      <div class="what" onclick="go({view:'progress',g:${gid}})">${what}${
        flag ? ` <span class="pill needs">${flag}</span>` : ""}</div>
      <div class="sub trunc">${sub}</div>
    </div>
    <span class="qacts">${acts}</span>
  </div>`;
}

/** One track per requirement. Segments are slices, ticks inside them are gates. */
function pipelineHtml(gs) {
  if (!gs.length) return "";
  const rows = gs.map((g) => {
    const slices = slicesOf(g.id);
    const doing = agentsOf(g.id).filter((a) => a.state === "running")
      .map((a) => `${a.role} ▸ ${a.activity || ""}`)[0];
    let mid;
    if (g.status === "PLANNING") mid = `<span class="plan">拆解中，未出卡</span>`;
    else if (g.status === "DRAFT") mid = `<span class="plan">计划卡已提交，等你同意</span>`;
    else if (!slices.length) mid = `<span class="plan">无切片</span>`;
    else mid = `<div class="track2">${slices.map(segHtml).join("")}</div>`;
    return `<div class="pipe" onclick="go({view:'progress',g:${g.id}})">
      <div>
        <div class="pname">${esc(g.name)}</div>
        <div class="pstate">${STATUS_ZH[g.status] ?? esc(g.status)}${g.spent_usd ? ` · ${money(g.spent_usd)}` : ""}</div>
      </div>
      <div>${mid}${doing ? `<div class="doing trunc">${esc(doing)}</div>` : ""}</div>
      <span class="meta">${g.branch ? esc(g.branch) : ""}</span>
    </div>`;
  }).join("");
  return `<h2 style="margin-top:1.5rem">每个需求走到哪</h2>${rows}`;
}

function segHtml(s) {
  let gates = {};
  try { gates = JSON.parse(s.gates_json || "{}"); } catch {}
  const waiting = s.status === "awaiting_boss";
  const failed = Object.values(gates).includes("fail");
  const cls = waiting ? "mine" : s.status === "done" ? "done"
    : failed ? "bad" : s.status === "pending" ? "" : "now";
  const ticks = ["self", "gate", "qa"].map((k) => {
    const v = gates[k];
    return `<i class="${v === "pass" ? "p" : v === "fail" ? "f" : s.status === k ? "n" : ""}"></i>`;
  }).join("");
  const mark = waiting ? "等你查收" : s.status === "done" ? "✓" : s.status === "pending" ? "⏸" : "";
  return `<span class="seg ${cls}" title="${esc(s.title)} — ${esc(s.accept_spec)}">
    <span class="sl">S${s.seq}<span class="grow"></span>${mark}</span>
    <span class="st">${esc(s.title)}</span>
    <span class="ticks">${ticks}</span>
  </span>`;
}

/** No project yet: one panel with the one field it needs, not a tutorial page. */
function setupHtml() {
  return `<div class="setup">
    <b>添加项目</b>
    <div class="why">需要一个本地 git 仓库。注册时自动检查：测试怎么跑、能不能开 PR。</div>
    <button class="go" onclick="openPick()">挑文件夹…</button>
  </div>`;
}

/* --------------------------------------------------------------- 工位墙 */

function deskView() {
  const ids = new Set(groupsOf(sel.p).map((g) => g.id));
  const rows = state.agents.filter((a) => !a.grp_id || ids.has(a.grp_id));
  if (!rows.length) return '<div class="none">无在职 agent</div>';
  return `<table><thead><tr>
      <th>角色</th><th>在哪个需求</th><th>正在做什么</th><th>model</th><th>权限</th>
      <th class="num">本轮 token</th><th class="num">花了</th>
    </tr></thead><tbody>
    ${rows.map((a) => {
      const g = state.groups.find((x) => x.id === a.grp_id);
      return `<tr>
        <td class="mono t-sm">${esc(a.role)}${a.state === "running" ? ' <span class="pill live">在跑</span>' : ""}</td>
        <td class="t-sm dim-2">${esc(g?.name ?? "常驻")}</td>
        <td class="t-sm dim-2 trunc" style="max-width:22rem">${esc(a.activity || a.state)}</td>
        <td class="mono t-xs dim">${esc(String(a.model).replace("claude-", ""))}</td>
        <td class="mono t-xs dim">${esc(a.clearance)}</td>
        <td class="num dim">${K(a.session_tokens)}</td>
        <td class="num">${money(a.total_usd)}</td>
      </tr>`;
    }).join("")}
  </tbody></table>`;
}

/* --------------------------------------------------------------- 所有权 */

function ownsView() {
  const gs = groupsOf(sel.p).filter((g) => owns(g).length);
  if (!gs.length) {
    return '<div class="none">暂无边界划分。开工前由 Architect 划定，避免两个需求改同一批文件。</div>';
  }
  // Overlap is what this view is for: two groups owning the same path is the exact
  // thing file ownership exists to prevent, so it gets named rather than implied.
  const pairs = [];
  for (let i = 0; i < gs.length; i++) {
    for (let j = i + 1; j < gs.length; j++) {
      const hit = owns(gs[i]).filter((a) => owns(gs[j]).some((b) =>
        a === b || a.startsWith(b.replace(/\*+$/, "")) || b.startsWith(a.replace(/\*+$/, ""))));
      if (hit.length) pairs.push([gs[i].name, gs[j].name, hit]);
    }
  }
  return `<table><thead><tr><th>需求</th><th>它管的文件</th><th>状态</th></tr></thead><tbody>
      ${gs.map((g) => `<tr><td>${esc(g.name)}</td>
        <td class="mono t-xs dim-2">${owns(g).map(esc).join("<br>")}</td>
        <td class="t-sm dim">${STATUS_ZH[g.status] ?? esc(g.status)}</td></tr>`).join("")}
    </tbody></table>
    ${pairs.length
      ? `<h3 class="clash">有重叠，不能同时开工</h3>` + pairs.map(([a, b, hit]) =>
          `<div class="t-sm clash">${esc(a)} 和 ${esc(b)}：<span class="mono">${hit.map(esc).join(" ")}</span></div>`).join("")
      : `<h3>无重叠</h3><div class="none">路径两两不相交，可并行。</div>`}`;
}

/* ---------------------------------------------------------------- 成本 */

function costView() {
  if (!cost || !cost.total || !cost.total.usd) {
    return '<div class="none">暂无支出。开工后按需求 / 切片 / 角色 / 难度分列。</div>';
  }
  // A cache ratio that suddenly drops is the only visible sign that prompt
  // assembly broke: agents keep working, tests keep passing, turns cost 3-5x.
  const cr = cost.cacheRatio == null ? "还没数据" : `${Math.round(cost.cacheRatio * 100)}%`;
  const ids = new Set(groupsOf(sel.p).map((g) => g.id));
  const bySlice = state.slices.filter((s) => ids.has(s.grp_id) && s.spent_usd)
    .map((s) => ({ label: `S${s.seq} ${s.title}`, usd: s.spent_usd, tokens: s.spent_tokens }))
    .sort((a, b) => b.usd - a.usd);

  const table = (title, rows) => {
    const list = (rows || []).filter((r) => r.usd);
    if (!list.length) return "";
    const top = Math.max(...list.map((r) => r.usd));
    return `<h3>${title}</h3><table><tbody>${list.map((r) => `<tr>
      <td class="t-sm trunc" style="max-width:20rem">${esc(r.label)}</td>
      <td style="width:40%"><span class="bar"><i style="width:${Math.max(2, (r.usd / top) * 100)}%"></i></span></td>
      <td class="num dim">${K(r.tokens)}</td>
      <td class="num">${money(r.usd)}</td></tr>`).join("")}</tbody></table>`;
  };
  return `<div class="row" style="gap:1.5rem;align-items:baseline">
      <b style="font-size:1.375rem">${money(cost.total.usd)}</b>
      <span class="meta">${K(cost.total.tokens)} tokens</span>
      <span class="meta">cache 命中 ${cr}</span>
    </div>
    ${table("按需求", cost.byGroup)}${table("按切片", bySlice)}
    ${table("按角色", cost.byRole)}${table("按难度", cost.byDifficulty)}`;
}

/* --------------------------------------------------------------- first run */

/* ------------------------------------------------------------ folder picker */

/**
 * The server reads the disk and lists directories, so the boss picks instead of
 * typing. A browser cannot hand over a real path, and a typed path is both ugly
 * and the likeliest place to make a mistake.
 */
let pickAt = null;

window.openPick = async (start) => {
  $("#pick").showModal();
  await loadDirs(start ?? null);
};

async function loadDirs(path) {
  const r = await fetch(`/api/dirs${path ? `?path=${encodeURIComponent(path)}` : ""}`);
  if (!r.ok) { $("#dlist").innerHTML = `<div class="none" style="padding:.875rem">${esc(await r.text())}</div>`; return; }
  const d = await r.json();
  pickAt = d;

  const parts = d.path.split("/").filter(Boolean);
  const crumbs = [`<button onclick="loadDirs('/')">/</button>`].concat(
    parts.map((seg, i) => `<button onclick="loadDirs('${esc("/" + parts.slice(0, i + 1).join("/"))}')">${esc(seg)}</button>`),
  ).join("<span class=\"dim\">/</span>");
  $("#crumbs").innerHTML = crumbs;

  $("#dlist").innerHTML = d.dirs.length
    ? d.dirs.map((x) => `<div class="drow ${x.repo ? "isrepo" : ""} ${x.taken ? "taken" : ""}"
        onclick="${x.repo && !x.taken ? `pickThis('${esc(x.path)}','${esc(x.name)}')` : `loadDirs('${esc(x.path)}')`}">
        <span class="ic">${x.repo ? "◆" : "▸"}</span>
        <span class="nm trunc">${esc(x.name)}</span>
        <span class="none">${x.taken ? "已添加" : x.repo ? "git 仓库 · 选择" : ""}</span>
      </div>`).join("")
    : '<div class="none" style="padding:.875rem">这个文件夹里没有子文件夹</div>';

  $("#pickhint").textContent = d.repo ? "当前目录即 git 仓库" : "git 仓库排在前面";
  $("#pickok").disabled = !d.repo;
  $("#pickok").onclick = () => submitPick(d.path, parts[parts.length - 1] ?? "project");
}
window.loadDirs = loadDirs;

window.pickThis = (path, name) => submitPick(path, name);

async function submitPick(path, folder) {
  const name = ($("#pname").value.trim() || folder).slice(0, 40);
  const r = await api("/api/projects", { name, repo_path: path });
  if (r.ok) { $("#pick").close(); $("#pname").value = ""; refresh(); }
}

/* -------------------------------------------------------------- actions */

window.ctl = async (id, action) => { await api(`/api/groups/${id}/${action}`); refresh(); };
window.interrupt = async (id, mode) => {
  // Rollback throws away the turn's work, so it asks; keeping it does not.
  if (mode === "rollback" && !confirm("回滚会丢掉这一轮改的东西，确定？")) return;
  const r = await api(`/api/groups/${id}/interrupt`, { mode });
  if (r.ok) refresh();
};
window.landed = async (id) => {
  if (!confirm("确认这个 branch 已经 merge 进 main？队列里其他组会被要求 rebase。")) return;
  await api(`/api/groups/${id}/landed`);
  refresh();
};
window.approve = async (id) => {
  const card = $(`#card-${id}`).value.trim();
  const filed = (state.draftCards ?? []).find((c) => c.grpId === id)?.body?.trim() ?? "";
  // Send the text only if it was edited: an untouched card is approved as filed,
  // which keeps "approve" and "edit then approve" from being the same request.
  const r = await api(`/api/draft/${id}/approve`, card && card !== filed ? { card } : {});
  if (r.ok) refresh();
};
window.reject = async (id) => { await api(`/api/draft/${id}/reject`, { reason: $(`#why-${id}`).value }); refresh(); };
window.answer = async (id) => { await api(`/api/escalations/${id}/answer`, { answer: $(`#ans-${id}`).value }); refresh(); };
window.delegate = async (id, to) => { await api(`/api/escalations/${id}/delegate`, { to }); refresh(); };
window.revoke = async (id) => {
  if (!confirm("会退回到它当初提问的那一刻，之后做的都不算，确定？")) return;
  await api(`/api/escalations/${id}/revoke`);
  refresh();
};
window.slice = async (id, decision) => { await api(`/api/slices/${id}/${decision}`); refresh(); };
window.sliceReject = async (id) => {
  const feedback = prompt("哪里不满意？照原话记下来，PM 据此改");
  if (feedback === null) return;
  await api(`/api/slices/${id}/reject`, { feedback });
  refresh();
};

/** Handlers rebind because the views that own them are re-rendered. */
function wire() {
  const drop = $("#drop");
  if (drop) {
    const send = async () => {
      const text = $("#idea").value.trim();
      if (!text) return;
      drop.disabled = true;
      const r = await api("/api/ideas", { project_id: sel.p, text });
      drop.disabled = false;
      if (r.ok) { $("#idea").value = ""; refresh(); }
    };
    drop.onclick = send;
    $("#idea").onkeydown = (e) => { if (e.key === "Enter") send(); };
  }
}

$("#sidetoggle").onclick = () => go({ side: !sel.side });

/* ------------------------------------------------------------------- feed */

// Buffered rather than appended straight to the DOM, so re-rendering a view never
// wipes it. Chat is a sidebar here, never the spine.
const frames = [];
function pushFrame(f) {
  frames.push(f);
  if (frames.length > 400) frames.splice(0, frames.length - 400);
  paintFeeds();
}
function paintFeeds() {
  const el = $("#feed-all");
  if (!el) return;
  const rows = frames.slice(-140).reverse()
    .map((f) => `<div class="${f.partial ? "partial" : "said-by"}">${esc(f.text)}</div>`).join("");
  el.innerHTML = rows || '<div class="none">无事件</div>';
}

function conn(cls, label) {
  const el = $("#conn");
  el.className = `conn t-xs mono ${cls}`;
  el.lastElementChild.textContent = label;
}

function connect() {
  // Replay a short tail so the sidebar has content on load. Exactly `lastSeq`
  // would be correct and useless: it would sit empty until something moved.
  const from = Math.max(0, (state.lastSeq || 0) - 60);
  const es = new EventSource(`/api/stream?since=${from}`);
  es.onopen = () => conn("on", "live");
  es.onerror = () => conn("off", "重连中");
  es.onmessage = (m) => {
    const f = JSON.parse(m.data);
    if (f.type === "live") {
      if (f.kind === "text" || f.kind === "thinking") {
        // Coalesce token-by-token text into one growing line.
        const last = frames[frames.length - 1];
        if (last && last.partial && last.agentId === f.agentId) {
          last.text = (last.text + f.body).slice(-400);
          return paintFeeds();
        }
        return pushFrame({ partial: true, agentId: f.agentId, text: f.body });
      }
      return pushFrame({ partial: true, agentId: f.agentId, text: `· ${f.body}` });
    }
    pushFrame({ text: `${f.author} ${f.kind}${f.intent ? "/" + f.intent : ""}: ${f.body}` });
    if (["state_change", "escalation", "note"].includes(f.kind)) refresh();
  };
}

readHash();
window.addEventListener("hashchange", () => { readHash(); render(); });
await refresh();
connect();
// Deep link to the picker, so "you have no project yet" can be one click from
// anywhere, including a notification.
if (new URLSearchParams(location.hash.slice(1)).get("pick")) openPick();
</script>
