[test]
# `bun test` with no path scans the whole tree, and the whole tree includes
# `data/` — the codex home and the staged skills, both full of other people's
# `*.test.ts`. Those failed as ours and buried the real result.
root = "test"
# Order matters. A preload entry is loaded and evaluated before the next one
# begins, and `test/support/coverage.ts` has to register its loader plugin before
# anything it should instrument is *loaded* — not merely before it runs, because
# a module graph is fetched ahead of evaluation. Registering from a later entry,
# or from an `import` at the top of setup.ts, both left the four holds below and
# their transitive closure out of the coverage map: fifty-six source files,
# `src/scheduler.ts` among them, silently reported as estimates.
#
# coverage.ts is inert unless ORCH_COVERAGE=1, so the default `bun test` pays
# only the module load.
#
# setup.ts clears the module-scope holds before every test, so no file inherits
# one from whatever ran before it.
#
# `dom.ts` is here for the same reason and one step later: it must install a
# document before any module that reaches `web/src` is evaluated, because Radix
# reads `globalThis?.document` once when it loads and never asks again. It runs
# after coverage.ts so the instrumentation sees it, and before setup.ts.
preload = ["./test/support/coverage.ts", "./test/support/dom.ts", "./test/support/setup.ts"]
